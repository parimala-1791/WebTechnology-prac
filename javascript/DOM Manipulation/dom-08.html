<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOM 08 - Attributes</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        img {
            width: 250px;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
            margin: 20px;
        }

        button {
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="box">

    <h1>Change Image Attribute</h1>

    <img id="image"
         src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
         alt="Original Image">

    <br>

    <button onclick="changeImage()">Change Image</button>

</div>

<script>

function changeImage() {

    let image = document.getElementById("image");

    image.setAttribute(
        "src",
        "https://images.unsplash.com/photo-1493246507139-91e8fad9978e"
    );

    image.setAttribute("alt", "New Image");

}

</script>

</body>
</html>
