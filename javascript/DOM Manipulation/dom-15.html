<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOM 15 - Dynamic Content Generator</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 650px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        input {
            padding: 12px;
            width: 70%;
        }

        button {
            padding: 12px 20px;
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #output {
            margin-top: 25px;
        }

        .card {
            background: #eff6ff;
            padding: 20px;
            margin-top: 15px;
            border-radius: 10px;
            border-left: 5px solid #2563eb;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="box">

    <h1>Dynamic Content Generator</h1>

    <input
        type="text"
        id="name"
        placeholder="Enter your name"
    >

    <br>

    <button onclick="generateContent()">
        Generate
    </button>

    <div id="output"></div>

</div>

<script>

function generateContent() {

    let name = document.getElementById("name").value;

    if (name.trim() === "") {

        alert("Please enter your name.");

        return;
    }

    let card = document.createElement("div");

    card.className = "card";

    card.innerHTML =
        "<h2>Hello, " + name + "!</h2>" +
        "<p>Welcome to our JavaScript DOM demonstration.</p>" +
        "<p>This content was generated dynamically.</p>";

    document.getElementById("output").appendChild(card);

}

</script>

</body>
</html>
