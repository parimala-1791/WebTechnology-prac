<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOM 04 - Change CSS</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        #text {
            font-size: 22px;
            margin: 25px;
        }

        button {
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="box">

    <h1>Change CSS Style</h1>

    <p id="text">Change my style!</p>

    <button onclick="changeStyle()">Change Style</button>

</div>

<script>

function changeStyle() {

    let text = document.getElementById("text");

    text.style.color = "#2563eb";
    text.style.fontSize = "32px";
    text.style.fontWeight = "bold";
    text.style.backgroundColor = "#dbeafe";
    text.style.padding = "15px";
    text.style.borderRadius = "10px";

}

</script>

</body>
</html>
