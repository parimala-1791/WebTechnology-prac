<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOM 07 - Classes</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        #card {
            padding: 25px;
            margin: 20px;
            border-radius: 10px;
            background: #f1f5f9;
        }

        .highlight {
            background: #dbeafe !important;
            color: #1d4ed8;
            border: 2px solid #2563eb;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .add {
            background: #2563eb;
            color: white;
        }

        .remove {
            background: #dc2626;
            color: white;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="box">

    <h1>Add and Remove Classes</h1>

    <div id="card">
        <h2>Sample Card</h2>
        <p>Click the buttons to change my class.</p>
    </div>

    <button class="add" onclick="addClass()">Add Class</button>

    <button class="remove" onclick="removeClass()">Remove Class</button>

</div>

<script>

function addClass() {

    document.getElementById("card").classList.add("highlight");

}

function removeClass() {

    document.getElementById("card").classList.remove("highlight");

}

</script>

</body>
</html>
