<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM 01 - Select Element by ID</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="box">

    <h1 id="title">DOM Manipulation</h1>

    <p id="message">Original message</p>

    <button onclick="changeMessage()">Change Message</button>

</div>

<script>

function changeMessage() {

    let element = document.getElementById("message");

    element.innerHTML = "Message changed using getElementById()!";

}

</script>

</body>
</html>
