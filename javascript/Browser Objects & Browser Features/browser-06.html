<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser 06 - Geolocation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            line-height: 2;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="box">

    <h1>Geolocation</h1>

    <p>
        Click the button to request your browser's location.
    </p>

    <button onclick="getLocation()">Get My Location</button>

    <div id="result"></div>

</div>

<script>

function getLocation() {

    let result = document.getElementById("result");

    if (!navigator.geolocation) {

        result.textContent =
            "Geolocation is not supported by this browser.";

        return;
    }

    result.textContent = "Requesting location...";

    navigator.geolocation.getCurrentPosition(

        function(position) {

            let latitude =
                position.coords.latitude;

            let longitude =
                position.coords.longitude;

            result.innerHTML =
                "Latitude: " + latitude + "<br>" +
                "Longitude: " + longitude;

        },

        function(error) {

            result.textContent =
                "Location permission was denied or unavailable.";

        }

    );

}

</script>

</body>
</html>
