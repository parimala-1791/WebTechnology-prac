<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser 04 - History Object</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin: 20px;
            font-size: 20px;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="box">

    <h1>History Object</h1>

    <p id="result">
        History length:
        <span id="length"></span>
    </p>

    <button onclick="goBack()">Go Back</button>

    <button onclick="goForward()">Go Forward</button>

</div>

<script>

function showHistoryLength() {

    document.getElementById("length").textContent =
        history.length;

}

function goBack() {

    history.back();

}

function goForward() {

    history.forward();

}

showHistoryLength();

</script>

</body>
</html>
