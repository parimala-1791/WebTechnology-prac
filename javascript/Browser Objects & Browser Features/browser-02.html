<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser 02 - Screen Object</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 650px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            line-height: 2;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="box">

    <h1>Screen Object</h1>

    <button onclick="showScreenInfo()">Show Screen Information</button>

    <div id="result"></div>

</div>

<script>

function showScreenInfo() {

    let screenInfo = screen;

    document.getElementById("result").innerHTML =
        "Screen Width: " + screenInfo.width + " px<br>" +
        "Screen Height: " + screenInfo.height + " px<br>" +
        "Available Width: " + screenInfo.availWidth + " px<br>" +
        "Available Height: " + screenInfo.availHeight + " px<br>" +
        "Color Depth: " + screenInfo.colorDepth;

}

</script>

</body>
</html>
