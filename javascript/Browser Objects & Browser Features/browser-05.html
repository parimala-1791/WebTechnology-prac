<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser 05 - Navigator Object</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            line-height: 2;
            word-break: break-word;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="box">

    <h1>Navigator Object</h1>

    <button onclick="showNavigator()">Show Browser Information</button>

    <div id="result"></div>

</div>

<script>

function showNavigator() {

    document.getElementById("result").innerHTML =
        "Browser: " + navigator.appName + "<br>" +
        "Platform: " + navigator.platform + "<br>" +
        "Language: " + navigator.language + "<br>" +
        "Cookies Enabled: " + navigator.cookieEnabled + "<br>" +
        "Online: " + navigator.onLine;

}

</script>

</body>
</html>
