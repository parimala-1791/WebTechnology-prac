<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser 01 - Window Object</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 650px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            line-height: 2;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="box">

    <h1>Window Object</h1>

    <button onclick="showWindowInfo()">Show Information</button>

    <div id="result"></div>

</div>

<script>

function showWindowInfo() {

    document.getElementById("result").innerHTML =
        "Window Width: " + window.innerWidth + " px<br>" +
        "Window Height: " + window.innerHeight + " px<br>" +
        "Screen Width: " + window.screen.width + " px<br>" +
        "Screen Height: " + window.screen.height + " px";

}

</script>

</body>
</html>
