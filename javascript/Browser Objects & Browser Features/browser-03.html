<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser 03 - Location Object</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            word-break: break-all;
            line-height: 2;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="box">

    <h1>Location Object</h1>

    <button onclick="showLocation()">Show URL Information</button>

    <div id="result"></div>

</div>

<script>

function showLocation() {

    document.getElementById("result").innerHTML =
        "Full URL: " + location.href + "<br>" +
        "Protocol: " + location.protocol + "<br>" +
        "Hostname: " + location.hostname + "<br>" +
        "Path: " + location.pathname;

}

</script>

</body>
</html>
