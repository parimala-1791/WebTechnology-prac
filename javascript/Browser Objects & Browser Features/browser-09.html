<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser 09 - Online Offline Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        #status {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="box">

    <h1>Online / Offline Detection</h1>

    <div id="status"></div>

</div>

<script>

function updateStatus() {

    let status =
        document.getElementById("status");

    if (navigator.onLine) {

        status.textContent = "You are ONLINE.";
        status.style.backgroundColor = "#dcfce7";
        status.style.color = "#166534";

    } else {

        status.textContent = "You are OFFLINE.";
        status.style.backgroundColor = "#fee2e2";
        status.style.color = "#991b1b";

    }

}

window.addEventListener("online", updateStatus);

window.addEventListener("offline", updateStatus);

updateStatus();

</script>

</body>
</html>
