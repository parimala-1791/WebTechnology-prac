<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser 08 - Clipboard API</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 650px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        textarea {
            width: 90%;
            height: 120px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: vertical;
        }

        button {
            padding: 12px 22px;
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="box">

    <h1>Clipboard API</h1>

    <textarea id="text">Hello! This text can be copied.</textarea>

    <br>

    <button onclick="copyText()">Copy Text</button>

    <div id="result"></div>

</div>

<script>

async function copyText() {

    let text =
        document.getElementById("text").value;

    let result =
        document.getElementById("result");

    try {

        await navigator.clipboard.writeText(text);

        result.textContent =
            "Text copied to clipboard!";

        result.style.color = "green";

    } catch (error) {

        result.textContent =
            "Unable to copy the text.";

        result.style.color = "red";

    }

}

</script>

</body>
</html>
