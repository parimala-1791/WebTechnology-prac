<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 03 - Email Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button {
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="box">

    <h1>Email Validation</h1>

    <form id="emailForm">

        <input
            type="text"
            id="email"
            placeholder="Enter your email"
        >

        <br>

        <button type="submit">Validate Email</button>

    </form>

    <div id="message"></div>

</div>

<script>

document.getElementById("emailForm").addEventListener("submit", function(event) {

    event.preventDefault();

    let email = document.getElementById("email").value.trim();

    let pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    let message = document.getElementById("message");

    if (pattern.test(email)) {

        message.textContent = "Valid email address.";
        message.style.color = "green";

    } else {

        message.textContent = "Invalid email address.";
        message.style.color = "red";

    }

});

</script>

</body>
</html>
