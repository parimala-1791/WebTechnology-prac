<!DOCTYPE html>
<html>
<head>
    <title>Local Storage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        input {
            padding: 12px;
            width: 80%;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #4f46e5;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Back to JavaScript Programs</a>
    </nav>

    <div class="container">

        <h1>Local Storage</h1>

        <p>Enter your name:</p>

        <input type="text" id="name" placeholder="Enter your name">

        <br>

        <button onclick="saveName()">Save</button>
        <button onclick="getName()">Get Name</button>
        <button onclick="removeName()">Remove</button>
        <button onclick="clearStorage()">Clear All</button>

        <div id="output"></div>

    </div>

    <script>

        function saveName() {
            let name = document.getElementById("name").value;

            if (name === "") {
                alert("Please enter your name");
                return;
            }

            localStorage.setItem("username", name);

            document.getElementById("output").innerHTML =
                "Name saved successfully!";
        }

        function getName() {
            let name = localStorage.getItem("username");

            if (name) {
                document.getElementById("output").innerHTML =
                    "Stored Name: " + name;
            } else {
                document.getElementById("output").innerHTML =
                    "No name found.";
            }
        }

        function removeName() {
            localStorage.removeItem("username");

            document.getElementById("output").innerHTML =
                "Name removed!";
        }

        function clearStorage() {
            localStorage.clear();

            document.getElementById("output").innerHTML =
                "Local storage cleared!";
        }

    </script>

</body>
</html>
