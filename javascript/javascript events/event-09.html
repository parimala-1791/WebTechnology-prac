<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event 09 - Submit Event</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        input {
            display: block;
            width: 80%;
            padding: 12px;
            margin: 12px auto;
        }

        button {
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="box">

    <h1>Form Submit Event</h1>

    <form id="myForm">

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">Submit</button>

    </form>

    <div id="result"></div>

</div>

<script>

document.getElementById("myForm").addEventListener("submit", function(event) {

    event.preventDefault();

    let name = document.getElementById("name").value;

    document.getElementById("result").textContent =
        "Form submitted successfully. Welcome " + name + "!";

});

</script>

</body>
</html>
