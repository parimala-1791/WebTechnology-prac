<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event 07 - Input Event</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        input {
            padding: 15px;
            width: 80%;
            font-size: 18px;
        }

        #result {
            margin-top: 25px;
            font-size: 22px;
            color: #2563eb;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="box">

    <h1>Input Event</h1>

    <input type="text" id="input" placeholder="Type your name">

    <div id="result"></div>

</div>

<script>

document.getElementById("input").addEventListener("input", function() {

    document.getElementById("result").textContent =
        "Hello, " + this.value;

});

</script>

</body>
</html>
