<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event 04 - Mouseout</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        #area {
            background: #2563eb;
            color: white;
            padding: 40px;
            border-radius: 12px;
            font-size: 22px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="box">

    <h1>Mouseout Event</h1>

    <div id="area">
        Move your mouse away from me
    </div>

</div>

<script>

document.getElementById("area").addEventListener("mouseout", function() {

    this.style.backgroundColor = "#dbeafe";
    this.style.color = "#1e293b";
    this.textContent = "Mouse left the element!";

});

</script>

</body>
</html>
