<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            text-align: center;
            padding: 50px;
        }

        .stopwatch {
            max-width: 450px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        #display {
            font-size: 50px;
            margin: 30px;
            font-weight: bold;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            background: #4f46e5;
            color: white;
        }

        button:hover {
            background: #3730a3;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #4f46e5;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="stopwatch">

    <h1>Stopwatch</h1>

    <div id="display">00:00:00</div>

    <button onclick="start()">Start</button>
    <button onclick="stop()">Stop</button>
    <button onclick="reset()">Reset</button>

</div>

<script>

let hours = 0;
let minutes = 0;
let seconds = 0;

let timer = null;

function updateDisplay() {

    let h = String(hours).padStart(2, "0");
    let m = String(minutes).padStart(2, "0");
    let s = String(seconds).padStart(2, "0");

    document.getElementById("display").innerHTML =
        h + ":" + m + ":" + s;
}

function start() {

    if (timer !== null) {
        return;
    }

    timer = setInterval(function() {

        seconds++;

        if (seconds === 60) {
            seconds = 0;
            minutes++;
        }

        if (minutes === 60) {
            minutes = 0;
            hours++;
        }

        updateDisplay();

    }, 1000);
}

function stop() {

    clearInterval(timer);
    timer = null;
}

function reset() {

    stop();

    hours = 0;
    minutes = 0;
    seconds = 0;

    updateDisplay();
}

</script>

</body>
</html>
