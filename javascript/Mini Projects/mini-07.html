<!DOCTYPE html>
<html>
<head>
    <title>Quiz App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ede9fe;
            text-align: center;
            padding: 40px;
        }

        .quiz {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        button {
            display: block;
            width: 80%;
            margin: 10px auto;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #7c3aed;
            color: white;
            font-size: 16px;
        }

        button:hover {
            background: #5b21b6;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #6d28d9;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="quiz">

    <h1>JavaScript Quiz</h1>

    <h2 id="question"></h2>

    <div id="options"></div>

    <div id="result"></div>

</div>

<script>

let questions = [
    {
        question: "Which keyword is used to declare a variable?",
        options: ["var", "define", "variable", "declare"],
        answer: "var"
    },
    {
        question: "Which symbol is used for comments?",
        options: ["//", "##", "<!--", "**"],
        answer: "//"
    },
    {
        question: "Which language runs in the browser?",
        options: ["Java", "Python", "JavaScript", "C"],
        answer: "JavaScript"
    }
];

let currentQuestion = 0;
let score = 0;

function showQuestion() {

    let q = questions[currentQuestion];

    document.getElementById("question").innerHTML =
        q.question;

    let optionsHTML = "";

    q.options.forEach(function(option) {

        optionsHTML +=
            "<button onclick=\"checkAnswer('" +
            option + "')\">" +
            option +
            "</button>";
    });

    document.getElementById("options").innerHTML =
        optionsHTML;
}

function checkAnswer(selected) {

    if (selected === questions[currentQuestion].answer) {
        score++;
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        document.getElementById("question").innerHTML =
            "Quiz Completed!";

        document.getElementById("options").innerHTML = "";

        document.getElementById("result").innerHTML =
            "Your Score: " + score + "/" + questions.length;
    }
}

showQuestion();

</script>

</body>
</html>
