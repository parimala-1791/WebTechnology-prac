<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
            padding: 50px;
        }

        .clock {
            max-width: 500px;
            margin: 50px auto;
            padding: 40px;
            background: #1f2937;
            border-radius: 20px;
        }

        #time {
            font-size: 60px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        #date {
            font-size: 20px;
            margin-top: 20px;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #93c5fd;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="clock">

    <h1>Digital Clock</h1>

    <div id="time"></div>

    <div id="date"></div>

</div>

<script>

function updateClock() {

    let now = new Date();

    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();

    let ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12;

    if (hours === 0) {
        hours = 12;
    }

    hours = String(hours).padStart(2, "0");
    minutes = String(minutes).padStart(2, "0");
    seconds = String(seconds).padStart(2, "0");

    document.getElementById("time").innerHTML =
        hours + ":" + minutes + ":" + seconds + " " + ampm;

    document.getElementById("date").innerHTML =
        now.toDateString();
}

setInterval(updateClock, 1000);

updateClock();

</script>

</body>
</html>
