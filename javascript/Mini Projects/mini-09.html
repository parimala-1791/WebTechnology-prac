<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ecfdf5;
            text-align: center;
            padding: 30px;
        }

        .game {
            width: 330px;
            margin: auto;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5px;
            margin: 20px auto;
        }

        .cell {
            width: 100px;
            height: 100px;
            font-size: 40px;
            background: white;
            border: 2px solid #059669;
            cursor: pointer;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #059669;
            color: white;
            cursor: pointer;
        }

        #status {
            font-size: 20px;
            font-weight: bold;
            margin: 20px;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #047857;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="game">

    <h1>Tic Tac Toe</h1>

    <div class="board">

        <button class="cell" onclick="play(0)"></button>
        <button class="cell" onclick="play(1)"></button>
        <button class="cell" onclick="play(2)"></button>

        <button class="cell" onclick="play(3)"></button>
        <button class="cell" onclick="play(4)"></button>
        <button class="cell" onclick="play(5)"></button>

        <button class="cell" onclick="play(6)"></button>
        <button class="cell" onclick="play(7)"></button>
        <button class="cell" onclick="play(8)"></button>

    </div>

    <div id="status">Player X's turn</div>

    <button onclick="resetGame()">Restart Game</button>

</div>

<script>

let board = ["", "", "", "", "", "", "", "",];

let player = "X";

let gameOver = false;

let cells = document.querySelectorAll(".cell");

let winningPatterns = [
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6]
];

function play(index) {

    if (board[index] !== "" || gameOver) {
        return;
    }

    board[index] = player;

    cells[index].innerHTML = player;

    checkWinner();

    if (!gameOver) {

        player = player === "X" ? "O" : "X";

        document.getElementById("status").innerHTML =
            "Player " + player + "'s turn";
    }
}

function checkWinner() {

    for (let pattern of winningPatterns) {

        let a = pattern[0];
        let b = pattern[1];
        let c = pattern[2];

        if (
            board[a] !== "" &&
            board[a] === board[b] &&
            board[b] === board[c]
        ) {

            document.getElementById("status").innerHTML =
                "🎉 Player " + player + " wins!";

            gameOver = true;

            return;
        }
    }

    if (!board.includes("")) {

        document.getElementById("status").innerHTML =
            "It's a draw!";

        gameOver = true;
    }
}

function resetGame() {

    board = ["", "", "", "", "", "", "", "",];

    player = "X";

    gameOver = false;

    cells.forEach(function(cell) {
        cell.innerHTML = "";
    });

    document.getElementById("status").innerHTML =
        "Player X's turn";
}

</script>

</body>
</html>
