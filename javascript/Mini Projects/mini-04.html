<!DOCTYPE html>
<html>
<head>
    <title>Countdown Timer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fef3c7;
            text-align: center;
            padding: 50px;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        input {
            padding: 12px;
            width: 80%;
            margin: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #f59e0b;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        #display {
            font-size: 40px;
            font-weight: bold;
            margin: 30px;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #b45309;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="container">

    <h1>Countdown Timer</h1>

    <input type="number" id="secondsInput" placeholder="Enter seconds">

    <br>

    <button onclick="startCountdown()">Start Countdown</button>

    <div id="display">00</div>

</div>

<script>

let timer;

function startCountdown() {

    clearInterval(timer);

    let seconds =
        Number(document.getElementById("secondsInput").value);

    if (seconds <= 0) {
        alert("Please enter a valid number of seconds");
        return;
    }

    document.getElementById("display").innerHTML = seconds;

    timer = setInterval(function() {

        seconds--;

        document.getElementById("display").innerHTML = seconds;

        if (seconds <= 0) {

            clearInterval(timer);

            document.getElementById("display").innerHTML =
                "Time's Up!";
        }

    }, 1000);
}

</script>

</body>
</html>
