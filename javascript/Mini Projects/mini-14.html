<!DOCTYPE html>
<html>
<head>
    <title>Password Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            text-align: center;
            padding: 50px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        input {
            padding: 12px;
            width: 80%;
            font-size: 18px;
        }

        button {
            padding: 12px 20px;
            margin: 15px;
            border: none;
            border-radius: 8px;
            background: #7c3aed;
            color: white;
            cursor: pointer;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #6d28d9;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="container">

    <h1>Password Generator</h1>

    <input type="text" id="password" readonly>

    <br>

    <button onclick="generatePassword()">Generate Password</button>

</div>

<script>

function generatePassword() {

    let characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
        "abcdefghijklmnopqrstuvwxyz" +
        "0123456789!@#$%^&*";

    let password = "";

    for (let i = 0; i < 12; i++) {

        let randomIndex =
            Math.floor(Math.random() * characters.length);

        password += characters[randomIndex];
    }

    document.getElementById("password").value =
        password;
}

</script>

</body>
</html>
