<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0fdf4;
            text-align: center;
            padding: 40px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        input {
            width: 65%;
            padding: 12px;
            font-size: 16px;
        }

        .add {
            padding: 12px 18px;
            border: none;
            background: #16a34a;
            color: white;
            cursor: pointer;
            border-radius: 6px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f3f4f6;
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #15803d;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="container">

    <h1>To-Do List</h1>

    <input type="text" id="taskInput" placeholder="Enter a task">

    <button class="add" onclick="addTask()">Add</button>

    <ul id="taskList"></ul>

</div>

<script>

function addTask() {

    let input = document.getElementById("taskInput");

    let task = input.value.trim();

    if (task === "") {
        alert("Please enter a task");
        return;
    }

    let li = document.createElement("li");

    li.innerHTML =
        "<span>" + task + "</span>" +
        "<button class='delete' onclick='deleteTask(this)'>Delete</button>";

    document.getElementById("taskList").appendChild(li);

    input.value = "";
}

function deleteTask(button) {

    button.parentElement.remove();

}

</script>

</body>
</html>
