<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff7ed;
            text-align: center;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .product {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin: 10px;
            background: #f3f4f6;
            border-radius: 10px;
        }

        button {
            padding: 9px 15px;
            border: none;
            border-radius: 7px;
            background: #ea580c;
            color: white;
            cursor: pointer;
        }

        #cart {
            margin-top: 30px;
            padding: 20px;
            background: #fff7ed;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #c2410c;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="container">

    <h1>Shopping Cart</h1>

    <div class="product">
        <span>Notebook - ₹100</span>
        <button onclick="addToCart(100)">Add</button>
    </div>

    <div class="product">
        <span>Pen - ₹30</span>
        <button onclick="addToCart(30)">Add</button>
    </div>

    <div class="product">
        <span>Bag - ₹800</span>
        <button onclick="addToCart(800)">Add</button>
    </div>

    <div class="product">
        <span>Bottle - ₹250</span>
        <button onclick="addToCart(250)">Add</button>
    </div>

    <div id="cart">

        <h2>Cart</h2>

        <p>Items: <span id="items">0</span></p>

        <p>Total: ₹<span id="total">0</span></p>

    </div>

</div>

<script>

let items = 0;
let total = 0;

function addToCart(price) {

    items++;

    total += price;

    document.getElementById("items").innerHTML = items;

    document.getElementById("total").innerHTML = total;
}

</script>

</body>
</html>
