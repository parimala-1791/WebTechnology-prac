<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eff6ff;
            text-align: center;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        input {
            padding: 12px;
            width: 80%;
            margin: 10px;
        }

        button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #1d4ed8;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="container">

    <h1>Grade Calculator</h1>

    <input type="number" id="mark1" placeholder="Subject 1">

    <input type="number" id="mark2" placeholder="Subject 2">

    <input type="number" id="mark3" placeholder="Subject 3">

    <input type="number" id="mark4" placeholder="Subject 4">

    <input type="number" id="mark5" placeholder="Subject 5">

    <button onclick="calculateGrade()">Calculate</button>

    <div id="result"></div>

</div>

<script>

function calculateGrade() {

    let marks = [
        Number(document.getElementById("mark1").value),
        Number(document.getElementById("mark2").value),
        Number(document.getElementById("mark3").value),
        Number(document.getElementById("mark4").value),
        Number(document.getElementById("mark5").value)
    ];

    let total = marks.reduce(function(sum, mark) {
        return sum + mark;
    }, 0);

    let average = total / 5;

    let grade;

    if (average >= 90) {
        grade = "A+";
    } else if (average >= 80) {
        grade = "A";
    } else if (average >= 70) {
        grade = "B";
    } else if (average >= 60) {
        grade = "C";
    } else if (average >= 50) {
        grade = "D";
    } else {
        grade = "F";
    }

    document.getElementById("result").innerHTML =
        "Total: " + total +
        "<br>Average: " + average.toFixed(2) +
        "<br>Grade: " + grade;
}

</script>

</body>
</html>
