<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e0f2fe;
            text-align: center;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        input {
            padding: 12px;
            width: 65%;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #0284c7;
            color: white;
            cursor: pointer;
        }

        #weather {
            margin-top: 25px;
            font-size: 20px;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #0369a1;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
</nav>

<div class="container">

    <h1>Weather App</h1>

    <input type="text" id="city" placeholder="Enter city">

    <button onclick="getWeather()">Search</button>

    <div id="weather"></div>

</div>

<script>

function getWeather() {

    let city = document.getElementById("city").value.trim();

    if (city === "") {
        alert("Please enter a city");
        return;
    }

    document.getElementById("weather").innerHTML =
        "<h2>" + city + "</h2>" +
        "<p>🌤️ Temperature: 28°C</p>" +
        "<p>Humidity: 65%</p>" +
        "<p>Condition: Partly Cloudy</p>";
}

</script>

</body>
</html>
