<!DOCTYPE html>
<html>
<head>
    <title>CSS 151 - SaaS Analytics Overview</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
        }

        .dashboard {
            padding: 30px 7%;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,.06);
        }

        .card h2 {
            color: #2563eb;
            font-size: 30px;
        }

        .card span {
            color: green;
        }

        .chart {
            background: white;
            margin-top: 25px;
            padding: 25px;
            border-radius: 15px;
        }

        .bars {
            height: 220px;
            display: flex;
            align-items: end;
            justify-content: space-around;
        }

        .bar {
            width: 45px;
            background: #2563eb;
            border-radius: 5px 5px 0 0;
        }

        .b1 { height: 100px; }
        .b2 { height: 150px; }
        .b3 { height: 120px; }
        .b4 { height: 180px; }
        .b5 { height: 200px; }

        @media(max-width:800px) {
            .cards {
                grid-template-columns: repeat(2,1fr);
            }
        }

        @media(max-width:500px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="dashboard">

    <h1>Analytics Overview</h1>

    <div class="cards">
        <div class="card">
            <p>Visitors</p>
            <h2>45K</h2>
            <span>↑ 18%</span>
        </div>

        <div class="card">
            <p>Revenue</p>
            <h2>$82K</h2>
            <span>↑ 12%</span>
        </div>

        <div class="card">
            <p>Orders</p>
            <h2>4,280</h2>
            <span>↑ 9%</span>
        </div>

        <div class="card">
            <p>Conversion</p>
            <h2>28%</h2>
            <span>↑ 5%</span>
        </div>
    </div>

    <div class="chart">
        <h2>Monthly Performance</h2>

        <div class="bars">
            <div class="bar b1"></div>
            <div class="bar b2"></div>
            <div class="bar b3"></div>
            <div class="bar b4"></div>
            <div class="bar b5"></div>
        </div>
    </div>

</div>

</body>
</html>
