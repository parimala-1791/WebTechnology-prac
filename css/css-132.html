<!DOCTYPE html>
<html>
<head>
    <title>CSS 132 - User Management</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
        }

        .container {
            padding: 40px 7%;
        }

        .table-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #eff6ff;
        }

        .active {
            color: green;
            font-weight: bold;
        }

        .inactive {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="container">

    <h1>User Management</h1>

    <div class="table-box">

        <table>
            <tr>
                <th>User</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
            </tr>

            <tr>
                <td>Priya</td>
                <td>priya@mail.com</td>
                <td>Admin</td>
                <td class="active">Active</td>
            </tr>

            <tr>
                <td>Rahul</td>
                <td>rahul@mail.com</td>
                <td>Developer</td>
                <td class="active">Active</td>
            </tr>

            <tr>
                <td>Ananya</td>
                <td>ananya@mail.com</td>
                <td>Designer</td>
                <td class="inactive">Inactive</td>
            </tr>

        </table>

    </div>

</div>

</body>
</html>
