<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 29 - Units</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        .px {
            width: 300px;
            padding: 20px;
            background: #dbeafe;
            margin-bottom: 15px;
        }

        .percent {
            width: 70%;
            padding: 20px;
            background: #dcfce7;
            margin-bottom: 15px;
        }

        .rem {
            font-size: 2rem;
            background: #fef3c7;
            padding: 20px;
            margin-bottom: 15px;
        }

        .vw {
            width: 50vw;
            padding: 20px;
            background: #ede9fe;
            box-sizing: border-box;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS Units</h1>
</header>

<div class="content">

    <div class="px">
        Pixel (px) Unit
    </div>

    <div class="percent">
        Percentage (%) Unit
    </div>

    <div class="rem">
        REM Unit
    </div>

    <div class="vw">
        Viewport Width (vw) Unit
    </div>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
