<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 27 - Outline</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        .box {
            padding: 25px;
            margin: 30px;
            border: 2px solid #2563eb;
            outline: 4px solid #93c5fd;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 12px;
            border: 2px solid #999;
            margin: 20px;
        }

        input:focus {
            outline: 3px solid #2563eb;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS Outline</h1>
</header>

<div class="content">

    <div class="box">
        This box has a border and an outline.
    </div>

    <h2>Focus Example</h2>

    <input type="text" placeholder="Click inside this input">

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
