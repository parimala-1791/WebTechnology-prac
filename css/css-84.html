<!DOCTYPE html>
<html>
<head>
    <title>CSS 84 - Responsive Navigation</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }

        nav {
            background: #172554;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .links {
            display: flex;
            gap: 25px;
        }

        .links a {
            color: white;
            text-decoration: none;
        }

        .links a:hover {
            color: #93c5fd;
        }

        .content {
            text-align: center;
            padding: 80px 20px;
        }

        .content h1 {
            color: #172554;
        }

        .content p {
            color: #64748b;
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }

        @media (max-width: 600px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            .links {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">MySite</div>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>

    </nav>

    <div class="content">

        <h1>Responsive Navigation</h1>

        <p>
            Resize the browser window to see the responsive design.
        </p>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
