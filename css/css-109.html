<!DOCTYPE html>
<html>
<head>
    <title>CSS 109 - Analytics Chart</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            text-decoration: none;
            color: #2563eb;
        }

        .chart {
            width: 80%;
            max-width: 800px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .bar {
            height: 35px;
            margin: 20px 0;
            background: #2563eb;
            border-radius: 5px;
            color: white;
            padding: 8px 15px;
        }

        .bar1 { width: 80%; }
        .bar2 { width: 65%; }
        .bar3 { width: 90%; }
        .bar4 { width: 50%; }
    </style>
</head>
<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="chart">
    <h1>Monthly Analytics</h1>

    <div class="bar bar1">January - 80%</div>
    <div class="bar bar2">February - 65%</div>
    <div class="bar bar3">March - 90%</div>
    <div class="bar bar4">April - 50%</div>
</div>

</body>
</html>
