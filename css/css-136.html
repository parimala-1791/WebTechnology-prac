<!DOCTYPE html>
<html>
<head>
    <title>CSS 136 - Login Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eff6ff;
        }

        .navigation {
            padding: 20px;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
        }

        .login {
            width: 380px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .login h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            margin-top: 15px;
        }

        .forgot {
            text-align: right;
            color: #2563eb;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="login">

    <h1>Welcome Back</h1>

    <input type="email" placeholder="Email">

    <input type="password" placeholder="Password">

    <div class="forgot">Forgot Password?</div>

    <button>Login</button>

</div>

</body>
</html>
