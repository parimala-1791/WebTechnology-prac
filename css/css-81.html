<!DOCTYPE html>
<html>
<head>
    <title>CSS 81 - Rating Stars</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            text-align: center;
        }

        .rating {
            width: 400px;
            margin: 100px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #cbd5e1;
        }

        h1 {
            color: #172554;
        }

        .stars {
            font-size: 45px;
            margin: 20px;
            color: #f59e0b;
            letter-spacing: 5px;
        }

        p {
            color: #64748b;
        }

        .navigation {
            margin: 60px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="rating">

        <h1>Rate Our Service</h1>

        <div class="stars">
            ★ ★ ★ ★ ☆
        </div>

        <p>4 out of 5 stars</p>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
