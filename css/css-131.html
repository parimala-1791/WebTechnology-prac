<!DOCTYPE html>
<html>
<head>
    <title>CSS 131 - Analytics Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
        }

        .dashboard {
            padding: 30px 7%;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        .card h2 {
            font-size: 30px;
            color: #2563eb;
        }

        .chart {
            margin-top: 25px;
            height: 300px;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        .bars {
            height: 200px;
            display: flex;
            align-items: end;
            gap: 25px;
        }

        .bar {
            width: 50px;
            background: #2563eb;
            border-radius: 5px 5px 0 0;
        }

        .b1 { height: 80px; }
        .b2 { height: 130px; }
        .b3 { height: 170px; }
        .b4 { height: 110px; }
        .b5 { height: 190px; }

        @media(max-width: 800px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="dashboard">

    <h1>Analytics Dashboard</h1>

    <div class="cards">
        <div class="card">
            <p>Visitors</p>
            <h2>24K</h2>
        </div>

        <div class="card">
            <p>Sales</p>
            <h2>$18K</h2>
        </div>

        <div class="card">
            <p>Orders</p>
            <h2>1,240</h2>
        </div>

        <div class="card">
            <p>Growth</p>
            <h2>28%</h2>
        </div>
    </div>

    <div class="chart">
        <h2>Monthly Revenue</h2>

        <div class="bars">
            <div class="bar b1"></div>
            <div class="bar b2"></div>
            <div class="bar b3"></div>
            <div class="bar b4"></div>
            <div class="bar b5"></div>
        </div>
    </div>

</div>

</body>
</html>
