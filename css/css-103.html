<!DOCTYPE html>
<html>
<head>
    <title>CSS 103 - Pricing Cards</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            text-decoration: none;
            color: #2563eb;
        }

        header {
            text-align: center;
            padding: 40px;
        }

        .pricing {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 20px;
        }

        .card {
            background: white;
            width: 300px;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .card h2 {
            color: #2563eb;
        }

        .price {
            font-size: 35px;
            font-weight: bold;
        }

        .card ul {
            list-style: none;
            padding: 0;
            line-height: 2;
            color: #667085;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .popular {
            border: 3px solid #2563eb;
            transform: scale(1.04);
        }

        @media(max-width: 900px) {
            .pricing {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<header>
    <h1>Choose Your Plan</h1>
    <p>Simple pricing for everyone.</p>
</header>

<section class="pricing">

    <div class="card">
        <h2>Basic</h2>
        <div class="price">$9</div>
        <ul>
            <li>5 Projects</li>
            <li>10 GB Storage</li>
            <li>Email Support</li>
        </ul>
        <button>Choose Plan</button>
    </div>

    <div class="card popular">
        <h2>Pro</h2>
        <div class="price">$29</div>
        <ul>
            <li>Unlimited Projects</li>
            <li>100 GB Storage</li>
            <li>Priority Support</li>
        </ul>
        <button>Choose Plan</button>
    </div>

    <div class="card">
        <h2>Enterprise</h2>
        <div class="price">$59</div>
        <ul>
            <li>Unlimited Storage</li>
            <li>Advanced Analytics</li>
            <li>24/7 Support</li>
        </ul>
        <button>Choose Plan</button>
    </div>

</section>

</body>
</html>
