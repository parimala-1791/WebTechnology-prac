<!DOCTYPE html>
<html>
<head>
    <title>CSS 248 - SaaS Landing Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            color: #172033;
        }

        nav {
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            background: #111827;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            padding: 100px 8%;
            text-align: center;
            background: linear-gradient(135deg,#eef2ff,#ffffff);
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 19px;
            max-width: 650px;
            margin: auto;
            line-height: 1.7;
        }

        button {
            margin-top: 30px;
            padding: 15px 30px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
        }

        .features {
            padding: 60px 8%;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 25px;
        }

        .feature {
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 15px;
        }

        @media(max-width:700px) {
            .features {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>

    <div>
        <a href="#">Features</a>
        <a href="#">Pricing</a>
        <a href="#">Contact</a>
    </div>
</nav>

<section class="hero">

    <h1>Build Better Products</h1>

    <p>
        A powerful SaaS platform that helps teams
        manage projects, customers and analytics.
    </p>

    <button>Get Started</button>

</section>

<section class="features">

    <div class="feature">
        <h2>Analytics</h2>
        <p>Understand your business with powerful analytics.</p>
    </div>

    <div class="feature">
        <h2>Automation</h2>
        <p>Automate repetitive business workflows.</p>
    </div>

    <div class="feature">
        <h2>Security</h2>
        <p>Keep your business data secure.</p>
    </div>

</section>

</body>
</html>
