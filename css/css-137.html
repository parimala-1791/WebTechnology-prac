<!DOCTYPE html>
<html>
<head>
    <title>CSS 137 - Signup Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
        }

        .navigation {
            padding: 20px;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
        }

        .signup {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="signup">

    <h1>Create Account</h1>

    <input type="text" placeholder="Full Name">
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">
    <input type="password" placeholder="Confirm Password">

    <button>Create Account</button>

</div>

</body>
</html>
