<!DOCTYPE html>
<html>
<head>
    <title>CSS 163 - AI Statistics</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
        }

        .stats {
            padding: 40px 8%;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,.06);
        }

        .icon {
            font-size: 35px;
        }

        .card h2 {
            color: #2563eb;
            font-size: 32px;
        }

        .card p {
            color: #667085;
        }

        @media(max-width:700px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<section class="stats">

    <div class="card">
        <div class="icon">🤖</div>
        <h2>24K</h2>
        <p>AI Requests</p>
    </div>

    <div class="card">
        <div class="icon">⚡</div>
        <h2>98%</h2>
        <p>Success Rate</p>
    </div>

    <div class="card">
        <div class="icon">⏱️</div>
        <h2>1.2s</h2>
        <p>Average Response</p>
    </div>

</section>

</body>
</html>69
