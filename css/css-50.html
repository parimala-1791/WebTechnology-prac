<!DOCTYPE html>
<html>
<head>
    <title>CSS 50 - Tooltips</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            color: #172554;
        }

        .tooltip {
            position: relative;
            display: inline-block;
            margin-top: 50px;
            padding: 15px 25px;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .tooltip-text {
            visibility: hidden;
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
            background: #172554;
            color: white;
            padding: 10px;
            border-radius: 6px;
            width: 180px;
        }

        .tooltip:hover .tooltip-text {
            visibility: visible;
        }

        .navigation {
            margin: 80px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CSS Tooltip</h1>

        <div class="tooltip">
            Hover over me

            <span class="tooltip-text">
                This is a CSS tooltip!
            </span>
        </div>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
