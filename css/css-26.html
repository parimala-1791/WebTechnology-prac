<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 26 - Cursor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        .cursor-box {
            padding: 20px;
            margin: 15px;
            border: 2px solid #2563eb;
            border-radius: 8px;
            text-align: center;
        }

        .pointer {
            cursor: pointer;
        }

        .help {
            cursor: help;
        }

        .not-allowed {
            cursor: not-allowed;
        }

        .move {
            cursor: move;
        }

        .text {
            cursor: text;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS Cursor Property</h1>
</header>

<div class="content">

    <div class="cursor-box pointer">
        Pointer Cursor
    </div>

    <div class="cursor-box help">
        Help Cursor
    </div>

    <div class="cursor-box not-allowed">
        Not Allowed Cursor
    </div>

    <div class="cursor-box move">
        Move Cursor
    </div>

    <div class="cursor-box text">
        Text Cursor
    </div>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
