<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 22 - CSS Functions</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        .calc-box {
            width: calc(100% - 40px);
            background: #dbeafe;
            padding: 20px;
            margin: 20px;
            box-sizing: border-box;
        }

        .min-box {
            width: min(500px, 100%);
            background: #dcfce7;
            padding: 20px;
        }

        .max-box {
            width: max(300px, 50%);
            background: #fef3c7;
            padding: 20px;
            margin-top: 20px;
        }

        h2 {
            font-size: clamp(24px, 5vw, 42px);
            color: #2563eb;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS Mathematical Functions</h1>
</header>

<div class="content">

    <h2>Responsive Heading</h2>

    <div class="calc-box">
        This box uses calc().
    </div>

    <div class="min-box">
        This box uses min().
    </div>

    <div class="max-box">
        This box uses max().
    </div>

    <p>
        The heading uses clamp() to change its size
        according to the screen width.
    </p>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
