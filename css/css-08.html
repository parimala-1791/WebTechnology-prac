<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS 08 - Borders</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        .box {
            padding: 25px;
            margin: 20px;
            text-align: center;
        }

        .solid {
            border: 3px solid #2563eb;
        }

        .dashed {
            border: 3px dashed #16a34a;
        }

        .dotted {
            border: 3px dotted #dc2626;
        }

        .double {
            border: 5px double #7c3aed;
        }

        .rounded {
            border: 3px solid #172554;
            border-radius: 20px;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }

    </style>
</head>

<body>

<header>
    <h1>CSS Borders</h1>
    <p>Different border styles</p>
</header>

<div class="content">

    <div class="box solid">
        Solid Border
    </div>

    <div class="box dashed">
        Dashed Border
    </div>

    <div class="box dotted">
        Dotted Border
    </div>

    <div class="box double">
        Double Border
    </div>

    <div class="box rounded">
        Rounded Border
    </div>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
