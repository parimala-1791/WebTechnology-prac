<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS 05 - Combinators</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        /* Descendant combinator */
        .box p {
            color: blue;
        }

        /* Child combinator */
        .parent > p {
            font-weight: bold;
        }

        /* Adjacent sibling */
        h2 + p {
            background: #dbeafe;
            padding: 10px;
        }

        /* General sibling */
        h3 ~ p {
            color: green;
        }

        .box {
            padding: 20px;
            border: 2px solid #2563eb;
            border-radius: 8px;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }

    </style>
</head>

<body>

<header>
    <h1>CSS Combinators</h1>
    <p>Connecting HTML elements using relationships</p>
</header>

<div class="content">

    <h2>Adjacent Sibling</h2>

    <p>
        This paragraph is immediately after the heading.
    </p>

    <div class="box">

        <h3>Combinator Examples</h3>

        <p>Paragraph inside the box.</p>

        <p>Another paragraph inside the box.</p>

    </div>

    <div class="parent">

        <p>This is a direct child.</p>

        <div>
            <p>This is a nested paragraph.</p>
        </div>

    </div>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
