<!DOCTYPE html>
<html>
<head>
    <title>CSS 263 - SaaS Healthcare Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6fa;
        }

        nav {
            background: #172033;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        .icon {
            font-size: 35px;
        }

        .appointment {
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        .item {
            padding: 18px;
            border-bottom: 1px solid #ddd;
        }

        @media(max-width:700px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="container">

    <h1>Healthcare Dashboard</h1>

    <div class="cards">

        <div class="card">
            <div class="icon">👨‍⚕️</div>
            <h2>Doctors</h2>
            <p>48 available</p>
        </div>

        <div class="card">
            <div class="icon">👥</div>
            <h2>Patients</h2>
            <p>1,240 registered</p>
        </div>

        <div class="card">
            <div class="icon">📅</div>
            <h2>Appointments</h2>
            <p>84 today</p>
        </div>

    </div>

    <div class="appointment">

        <h2>Upcoming Appointments</h2>

        <div class="item">
            <strong>10:00 AM</strong> — Dr. Smith
        </div>

        <div class="item">
            <strong>11:30 AM</strong> — Dr. Johnson
        </div>

        <div class="item">
            <strong>02:00 PM</strong> — Dr. Miller
        </div>

    </div>

</div>

</body>
</html>
