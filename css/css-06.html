<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS 06 - Colors</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background-color: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        .color-box {
            padding: 25px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
        }

        .named {
            background: red;
            color: white;
        }

        .hex {
            background: #2563eb;
            color: white;
        }

        .rgb {
            background: rgb(34, 197, 94);
        }

        .rgba {
            background: rgba(168, 85, 247, 0.6);
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }

    </style>
</head>

<body>

<header>
    <h1>CSS Colors</h1>
    <p>Different ways to define colors</p>
</header>

<div class="content">

    <div class="color-box named">
        Named Color
    </div>

    <div class="color-box hex">
        HEX Color
    </div>

    <div class="color-box rgb">
        RGB Color
    </div>

    <div class="color-box rgba">
        RGBA Color
    </div>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
