<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 33 - 2D Transforms</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 50px;
        }

        .box {
            width: 130px;
            height: 100px;
            background: #2563eb;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            transition: transform 0.5s;
        }

        .translate:hover {
            transform: translate(30px, 20px);
        }

        .rotate:hover {
            transform: rotate(30deg);
        }

        .scale:hover {
            transform: scale(1.3);
        }

        .skew:hover {
            transform: skew(15deg);
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS 2D Transforms</h1>
    <p>Translate, Rotate, Scale and Skew</p>
</header>

<div class="content">

    <div class="container">

        <div class="box translate">
            Translate
        </div>

        <div class="box rotate">
            Rotate
        </div>

        <div class="box scale">
            Scale
        </div>

        <div class="box skew">
            Skew
        </div>

    </div>

    <p style="text-align:center; margin-top:40px;">
        Hover over each box to see the transformation.
    </p>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
