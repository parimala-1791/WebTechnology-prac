<!DOCTYPE html>
<html>
<head>
    <title>CSS 75 - File Upload</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .upload {
            width: 450px;
            margin: 70px auto;
            padding: 40px;
            text-align: center;
            background: white;
            border: 2px dashed #2563eb;
            border-radius: 15px;
            box-shadow: 0 5px 15px #cbd5e1;
        }

        .icon {
            font-size: 50px;
        }

        h1 {
            color: #172554;
        }

        p {
            color: #64748b;
        }

        input {
            margin-top: 20px;
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }

        @media (max-width: 550px) {
            .upload {
                width: 75%;
            }
        }
    </style>
</head>

<body>

    <div class="upload">

        <div class="icon">📁</div>

        <h1>Upload File</h1>

        <p>Select a file from your computer.</p>

        <input type="file">

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
