<!DOCTYPE html>
<html>
<head>
    <title>CSS 217 - SaaS Team Cards</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7fb;
        }

        nav {
            background: #172033;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        .team {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .member {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 18px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            margin: auto;
            border-radius: 50%;
            background: #4f46e5;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            font-weight: bold;
        }

        .role {
            color: #6b7280;
        }
    </style>
</head>
<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="container">

    <h1>Our Team</h1>

    <div class="team">

        <div class="member">
            <div class="avatar">PK</div>
            <h2>Priya Kumar</h2>
            <p class="role">Product Manager</p>
        </div>

        <div class="member">
            <div class="avatar">AR</div>
            <h2>Alex Roy</h2>
            <p class="role">UI Designer</p>
        </div>

        <div class="member">
            <div class="avatar">SK</div>
            <h2>Sam Kumar</h2>
            <p class="role">Developer</p>
        </div>

    </div>

</div>

</body>
</html>
