<!DOCTYPE html>
<html>
<head>
    <title>CSS 143 - Error Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }

        .navigation {
            padding: 20px;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
        }

        .error {
            text-align: center;
            margin-top: 100px;
        }

        .error h1 {
            font-size: 100px;
            color: #2563eb;
            margin: 0;
        }

        .error p {
            color: #667085;
            font-size: 18px;
        }

        button {
            padding: 12px 25px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="error">

    <h1>404</h1>

    <h2>Page Not Found</h2>

    <p>The page you are looking for does not exist.</p>

    <button>Go Home</button>

</div>

</body>
</html>
