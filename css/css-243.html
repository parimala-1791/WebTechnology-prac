<!DOCTYPE html>
<html>
<head>
    <title>CSS 243 - SaaS Marketing Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6fa;
        }

        nav {
            background: #111827;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .campaigns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .campaign {
            background: white;
            padding: 25px;
            border-radius: 16px;
        }

        .progress {
            height: 12px;
            background: #e5e7eb;
            border-radius: 20px;
            margin: 15px 0;
        }

        .progress span {
            display: block;
            height: 100%;
            background: #4f46e5;
            border-radius: 20px;
        }

        .status {
            color: #16a34a;
            font-weight: bold;
        }

        @media(max-width:750px) {
            .campaigns {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="container">

    <h1>Marketing Campaigns</h1>

    <div class="campaigns">

        <div class="campaign">
            <h2>Summer Campaign</h2>
            <p>Budget: $15,000</p>
            <p>Spent: $10,500</p>

            <div class="progress">
                <span style="width:70%"></span>
            </div>

            <p class="status">Active</p>
        </div>

        <div class="campaign">
            <h2>Product Launch</h2>
            <p>Budget: $20,000</p>
            <p>Spent: $16,000</p>

            <div class="progress">
                <span style="width:80%"></span>
            </div>

            <p class="status">Active</p>
        </div>

        <div class="campaign">
            <h2>Email Campaign</h2>
            <p>Budget: $8,000</p>
            <p>Spent: $6,400</p>

            <div class="progress">
                <span style="width:80%"></span>
            </div>

            <p class="status">Active</p>
        </div>

    </div>

</div>

</body>
</html>
