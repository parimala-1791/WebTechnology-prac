<!DOCTYPE html>
<html>
<head>
    <title>CSS 80 - Cookie Banner</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .content {
            text-align: center;
            padding: 80px;
        }

        h1 {
            color: #172554;
        }

        .cookie {
            position: fixed;
            bottom: 20px;
            left: 5%;
            width: 90%;
            background: #172554;
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .cookie p {
            margin: 0;
            color: #dbeafe;
        }

        .cookie button {
            padding: 10px 20px;
            border: none;
            border-radius: 7px;
            background: white;
            color: #172554;
            cursor: pointer;
        }

        .navigation {
            text-align: center;
            margin: 50px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }

        @media (max-width: 650px) {
            .cookie {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="content">

        <h1>Welcome to Our Website</h1>

        <p>
            This page demonstrates a CSS cookie notification banner.
        </p>

    </div>

    <div class="cookie">

        <p>
            We use cookies to improve your browsing experience.
        </p>

        <button>Accept</button>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
