<!DOCTYPE html>
<html>
<head>
    <title>CSS 76 - Empty State</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }

        .empty {
            width: 500px;
            margin: 100px auto;
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #cbd5e1;
        }

        .icon {
            font-size: 70px;
        }

        h1 {
            color: #172554;
        }

        p {
            color: #64748b;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 7px;
            cursor: pointer;
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="empty">

        <div class="icon">📭</div>

        <h1>No Items Found</h1>

        <p>
            There are currently no items available.
        </p>

        <button>Add New Item</button>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
