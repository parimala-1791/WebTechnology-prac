<!DOCTYPE html>
<html>
<head>
    <title>CSS 213 - Revenue Analytics</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        nav {
            background: #172033;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .revenue {
            background: white;
            padding: 30px;
            border-radius: 18px;
        }

        .amount {
            font-size: 45px;
            font-weight: bold;
        }

        .chart {
            height: 250px;
            display: flex;
            align-items: end;
            gap: 20px;
            margin-top: 30px;
        }

        .bar {
            flex: 1;
            background: #4f46e5;
            border-radius: 8px 8px 0 0;
        }

        .b1 { height: 40%; }
        .b2 { height: 60%; }
        .b3 { height: 50%; }
        .b4 { height: 80%; }
        .b5 { height: 70%; }
        .b6 { height: 90%; }
    </style>
</head>
<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="container">

    <div class="revenue">
        <h1>Revenue Overview</h1>
        <div class="amount">$128,450</div>
        <p>Monthly revenue</p>

        <div class="chart">
            <div class="bar b1"></div>
            <div class="bar b2"></div>
            <div class="bar b3"></div>
            <div class="bar b4"></div>
            <div class="bar b5"></div>
            <div class="bar b6"></div>
        </div>
    </div>

</div>

</body>
</html>
