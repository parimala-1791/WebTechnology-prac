<!DOCTYPE html>
<html>
<head>
<title>CSS 171 - AI Pricing Cards</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb}
.navigation{padding:20px;background:white}
.navigation a{margin-right:20px;color:#2563eb}
.pricing{display:flex;justify-content:center;gap:25px;padding:50px 8%}
.card{background:white;width:300px;padding:30px;border-radius:15px;text-align:center;box-shadow:0 5px 20px #ddd}
.card h2{color:#2563eb}
.price{font-size:38px;font-weight:bold}
.card ul{list-style:none;padding:0;line-height:2;color:#667085}
button{padding:13px 30px;border:0;background:#2563eb;color:white;border-radius:8px}
.featured{border:3px solid #2563eb}
@media(max-width:800px){.pricing{flex-direction:column;align-items:center}}
</style>
</head>
<body>

<div class="navigation">
<a href="../index.html">Home</a>
<a href="index.html">Back to CSS Programs</a>
</div>

<h1 style="text-align:center">AI Plans</h1>

<section class="pricing">
<div class="card">
<h2>Starter</h2>
<div class="price">$9</div>
<ul><li>100 AI Requests</li><li>5 Projects</li><li>Email Support</li></ul>
<button>Choose</button>
</div>

<div class="card featured">
<h2>Pro</h2>
<div class="price">$29</div>
<ul><li>Unlimited Requests</li><li>Unlimited Projects</li><li>Priority Support</li></ul>
<button>Choose</button>
</div>

<div class="card">
<h2>Enterprise</h2>
<div class="price">$79</div>
<ul><li>Advanced AI</li><li>Team Management</li><li>24/7 Support</li></ul>
<button>Choose</button>
</div>
</section>

</body>
</html>
