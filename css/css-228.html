<!DOCTYPE html>
<html>
<head>
    <title>CSS 228 - SaaS Subscription Plans</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial;
            background: #f5f7fb;
        }

        nav {
            background: #172033;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }

        .plans {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 30px;
        }

        .plan {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,.08);
        }

        .featured {
            border: 3px solid #4f46e5;
            transform: scale(1.03);
        }

        .price {
            font-size: 36px;
            font-weight: bold;
        }

        button {
            padding: 12px 25px;
            border: none;
            background: #4f46e5;
            color: white;
            border-radius: 8px;
        }

        @media(max-width:750px) {
            .plans { grid-template-columns: 1fr; }
            .featured { transform: none; }
        }
    </style>
</head>
<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="container">

    <h1>Choose Your Plan</h1>

    <div class="plans">

        <div class="plan">
            <h2>Starter</h2>
            <div class="price">$9</div>
            <p>per month</p>
            <p>✓ 5 Projects</p>
            <p>✓ Basic Analytics</p>
            <button>Choose Plan</button>
        </div>

        <div class="plan featured">
            <h2>Professional</h2>
            <div class="price">$29</div>
            <p>per month</p>
            <p>✓ Unlimited Projects</p>
            <p>✓ Advanced Analytics</p>
            <button>Choose Plan</button>
        </div>

        <div class="plan">
            <h2>Enterprise</h2>
            <div class="price">$79</div>
            <p>per month</p>
            <p>✓ Team Management</p>
            <p>✓ Premium Support</p>
            <button>Choose Plan</button>
        </div>

    </div>

</div>

</body>
</html>
