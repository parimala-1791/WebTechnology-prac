<!DOCTYPE html>
<html>
<head>
    <title>CSS 37 - Hero Section</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }

        .hero {
            min-height: 450px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 10%;
            background: linear-gradient(135deg, #172554, #2563eb);
            color: white;
        }

        .hero-text {
            max-width: 550px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: white;
            color: #2563eb;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .button:hover {
            background: #dbeafe;
        }

        .hero-box {
            width: 250px;
            height: 200px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2563eb;
            font-size: 25px;
            font-weight: bold;
        }

        .navigation {
            text-align: center;
            padding: 30px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }

        @media (max-width: 700px) {
            .hero {
                flex-direction: column;
                text-align: center;
                gap: 40px;
            }

            .hero h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <section class="hero">

        <div class="hero-text">
            <h1>Build Something Amazing</h1>

            <p>
                Create modern and beautiful websites using
                HTML and CSS.
            </p>

            <a href="#" class="button">Get Started</a>
        </div>

        <div class="hero-box">
            CSS HERO
        </div>

    </section>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
