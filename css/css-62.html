<!DOCTYPE html>
<html>
<head>
    <title>CSS 62 - Chip Component</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }

        .container {
            max-width: 700px;
            margin: 70px auto;
            text-align: center;
        }

        h1 {
            color: #172554;
        }

        .chip {
            display: inline-block;
            padding: 10px 18px;
            margin: 8px;
            background: #dbeafe;
            color: #1e40af;
            border-radius: 20px;
            font-weight: bold;
        }

        .chip span {
            margin-left: 8px;
            cursor: pointer;
        }

        .green {
            background: #dcfce7;
            color: #166534;
        }

        .yellow {
            background: #fef3c7;
            color: #92400e;
        }

        .red {
            background: #fee2e2;
            color: #991b1b;
        }

        .navigation {
            margin: 50px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Chip Components</h1>

        <div class="chip">
            HTML <span>×</span>
        </div>

        <div class="chip green">
            CSS <span>×</span>
        </div>

        <div class="chip yellow">
            JavaScript <span>×</span>
        </div>

        <div class="chip red">
            Python <span>×</span>
        </div>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
