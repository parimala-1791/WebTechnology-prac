<!DOCTYPE html>
<html>
<head>
    <title>CSS 246 - Complete SaaS Analytics</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6fa;
            color: #172033;
        }

        nav {
            background: #111827;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 1150px;
            margin: 40px auto;
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
        }

        .green {
            color: #16a34a;
        }

        .section {
            background: white;
            padding: 30px;
            margin-top: 25px;
            border-radius: 15px;
        }

        .bar {
            height: 25px;
            background: #e5e7eb;
            border-radius: 20px;
            margin: 15px 0;
        }

        .bar span {
            display: block;
            height: 100%;
            background: #4f46e5;
            border-radius: 20px;
        }

        @media(max-width:850px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:500px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="container">

    <h1>SaaS Analytics</h1>

    <div class="cards">

        <div class="card">
            <p>Revenue</p>
            <div class="number">$128K</div>
            <p class="green">+18%</p>
        </div>

        <div class="card">
            <p>Users</p>
            <div class="number">24.5K</div>
            <p class="green">+12%</p>
        </div>

        <div class="card">
            <p>Projects</p>
            <div class="number">1,240</div>
            <p class="green">+8%</p>
        </div>

        <div class="card">
            <p>Conversion</p>
            <div class="number">7.8%</div>
            <p class="green">+2%</p>
        </div>

    </div>

    <div class="section">

        <h2>Performance</h2>

        <p>Users</p>
        <div class="bar">
            <span style="width:85%"></span>
        </div>

        <p>Revenue</p>
        <div class="bar">
            <span style="width:75%"></span>
        </div>

        <p>Engagement</p>
        <div class="bar">
            <span style="width:65%"></span>
        </div>

    </div>

</div>

</body>
</html>
