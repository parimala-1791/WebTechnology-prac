<!DOCTYPE html>
<html>
<head>
    <title>CSS 123 - Feature Comparison</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
        }

        .comparison {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #2563eb;
            color: white;
        }

        td:first-child {
            text-align: left;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="comparison">

    <h1>Plan Comparison</h1>

    <table>
        <tr>
            <th>Feature</th>
            <th>Basic</th>
            <th>Pro</th>
            <th>Enterprise</th>
        </tr>

        <tr>
            <td>Projects</td>
            <td>5</td>
            <td>Unlimited</td>
            <td>Unlimited</td>
        </tr>

        <tr>
            <td>Storage</td>
            <td>10 GB</td>
            <td>100 GB</td>
            <td>1 TB</td>
        </tr>

        <tr>
            <td>Analytics</td>
            <td>✓</td>
            <td>✓</td>
            <td>✓</td>
        </tr>

        <tr>
            <td>Support</td>
            <td>Email</td>
            <td>Priority</td>
            <td>24/7</td>
        </tr>
    </table>

</div>

</body>
</html>
