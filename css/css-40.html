<!DOCTYPE html>
<html>
<head>
    <title>CSS 40 - Login Form</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #dbeafe;
        }

        .login-box {
            width: 350px;
            margin: 80px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px #94a3b8;
        }

        h1 {
            text-align: center;
            color: #172554;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        .remember {
            margin-top: 15px;
        }

        .remember input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #172554;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Login</h1>

        <form>

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" placeholder="Enter your password">

            <div class="remember">
                <input type="checkbox">
                Remember me
            </div>

            <button type="submit">Login</button>

        </form>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
