<!DOCTYPE html>
<html>
<head>
    <title>CSS 231 - SaaS Developer Portal</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6fa;
        }

        nav {
            background: #172033;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .api-card {
            background: white;
            padding: 30px;
            border-radius: 18px;
        }

        .endpoint {
            background: #111827;
            color: white;
            padding: 20px;
            border-radius: 10px;
            font-family: monospace;
            margin: 20px 0;
        }

        .method {
            color: #4ade80;
            font-weight: bold;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .feature {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
        }

        @media(max-width:700px) {
            .features { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="container">

    <div class="api-card">

        <h1>Developer Portal</h1>
        <p>Build powerful applications using our APIs.</p>

        <div class="endpoint">
            <span class="method">GET</span>
            /api/v1/users
        </div>

        <div class="features">

            <div class="feature">
                <h2>API Reference</h2>
                <p>Explore available endpoints.</p>
            </div>

            <div class="feature">
                <h2>Authentication</h2>
                <p>Secure your API requests.</p>
            </div>

            <div class="feature">
                <h2>SDKs</h2>
                <p>Use our developer tools.</p>
            </div>

        </div>

    </div>

</div>

</body>
</html>
