<!DOCTYPE html>
<html>
<head>
    <title>CSS 251 - SaaS Startup Homepage</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
        }

        nav {
            padding: 20px 8%;
            background: #172033;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        .hero {
            min-height: 500px;
            padding: 100px 8%;
            background: linear-gradient(135deg,#312e81,#4f46e5);
            color: white;
        }

        .hero h1 {
            font-size: 55px;
            max-width: 700px;
        }

        .hero p {
            font-size: 20px;
            max-width: 650px;
            line-height: 1.7;
        }

        button {
            padding: 15px 30px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #312e81;
            font-weight: bold;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            padding: 50px 8%;
            gap: 20px;
            text-align: center;
        }

        .stat {
            padding: 25px;
        }

        .number {
            font-size: 35px;
            font-weight: bold;
        }

        @media(max-width:650px) {
            .hero h1 {
                font-size: 40px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<section class="hero">

    <h1>Grow Your Business With Smarter Software</h1>

    <p>
        Manage customers, projects, analytics and
        workflows from one powerful platform.
    </p>

    <button>Start Free</button>

</section>

<section class="stats">

    <div class="stat">
        <div class="number">25K+</div>
        <p>Users</p>
    </div>

    <div class="stat">
        <div class="number">120+</div>
        <p>Countries</p>
    </div>

    <div class="stat">
        <div class="number">99.9%</div>
        <p>Uptime</p>
    </div>

</section>

</body>
</html>
