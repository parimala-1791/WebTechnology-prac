<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS 10 - Fonts</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        .arial {
            font-family: Arial, sans-serif;
        }

        .serif {
            font-family: Georgia, serif;
        }

        .mono {
            font-family: "Courier New", monospace;
        }

        .bold {
            font-weight: bold;
        }

        .italic {
            font-style: italic;
        }

        .large {
            font-size: 28px;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }

    </style>
</head>

<body>

<header>
    <h1>CSS Fonts</h1>
    <p>Font families, sizes and styles</p>
</header>

<div class="content">

    <p class="arial">
        This text uses Arial font.
    </p>

    <p class="serif">
        This text uses Georgia serif font.
    </p>

    <p class="mono">
        This text uses Courier New monospace font.
    </p>

    <p class="bold">
        This text is bold.
    </p>

    <p class="italic">
        This text is italic.
    </p>

    <p class="large">
        This text has a larger font size.
    </p>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
