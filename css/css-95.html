<!DOCTYPE html>
<html>
<head>
    <title>CSS 95 - Calendar UI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .calendar {
            width: 500px;
            margin: 60px auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px #cbd5e1;
        }

        .header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .days,
        .dates {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .days div {
            padding: 12px;
            background: #dbeafe;
            text-align: center;
            font-weight: bold;
        }

        .dates div {
            padding: 18px 8px;
            text-align: center;
            border: 1px solid #f1f5f9;
        }

        .dates div:hover {
            background: #dbeafe;
        }

        .today {
            background: #2563eb !important;
            color: white;
            border-radius: 50%;
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="calendar">

        <div class="header">
            <h2>September 2026</h2>
        </div>

        <div class="days">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>

        <div class="dates">

            <div></div>
            <div></div>

            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>

            <div>6</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div>10</div>
            <div>11</div>
            <div>12</div>

            <div>13</div>
            <div>14</div>
            <div>15</div>
            <div>16</div>
            <div>17</div>
            <div>18</div>
            <div>19</div>

            <div>20</div>
            <div class="today">21</div>
            <div>22</div>
            <div>23</div>
            <div>24</div>
            <div>25</div>
            <div>26</div>

            <div>27</div>
            <div>28</div>
            <div>29</div>
            <div>30</div>

        </div>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
