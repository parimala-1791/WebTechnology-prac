<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 19 - Box Shadow</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        .card {
            width: 250px;
            padding: 30px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            text-align: center;
        }

        .small-shadow {
            box-shadow: 2px 2px 8px #999;
        }

        .large-shadow {
            box-shadow: 8px 8px 20px #999;
        }

        .inset-shadow {
            box-shadow: inset 0 0 15px #999;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS Box Shadow</h1>
</header>

<div class="content">

    <div class="card small-shadow">
        Small Shadow
    </div>

    <div class="card large-shadow">
        Large Shadow
    </div>

    <div class="card inset-shadow">
        Inset Shadow
    </div>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
