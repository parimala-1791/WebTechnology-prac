<!DOCTYPE html>
<html>
<head>
    <title>CSS 44 - Modal Popup</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
        }

        h1 {
            color: #172554;
            margin-top: 70px;
        }

        .open-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .open-button:hover {
            background: #172554;
        }

        #popup {
            display: none;
        }

        #popup:checked ~ .modal {
            display: flex;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
        }

        .modal-box h2 {
            color: #172554;
        }

        .close-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #dc2626;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        .navigation {
            margin: 50px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <h1>CSS Modal Popup</h1>

    <label for="popup" class="open-button">
        Open Popup
    </label>

    <input type="checkbox" id="popup" hidden>

    <div class="modal">

        <div class="modal-box">

            <h2>Hello!</h2>

            <p>
                This popup is created using only HTML and CSS.
            </p>

            <label for="popup" class="close-button">
                Close
            </label>

        </div>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
