<!DOCTYPE html>
<html>
<head>
    <title>CSS 225 - SaaS Calendar</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6fa;
        }

        nav {
            background: #111827;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .calendar {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .month {
            background: white;
            padding: 25px;
            border-radius: 18px;
        }

        .days,
        .dates {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .days div {
            font-weight: bold;
            text-align: center;
            padding: 10px;
        }

        .date {
            min-height: 70px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
        }

        .event {
            background: #4f46e5;
            color: white;
            padding: 4px;
            border-radius: 5px;
            font-size: 11px;
            margin-top: 5px;
        }

        @media(max-width:600px) {
            .date { min-height: 50px; font-size: 12px; }
        }
    </style>
</head>
<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="calendar">

    <div class="month">

        <h1>September 2026</h1>

        <div class="days">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>

        <div class="dates">

            <div class="date"></div>
            <div class="date">1</div>
            <div class="date">2</div>
            <div class="date">3</div>
            <div class="date">4</div>
            <div class="date">5</div>
            <div class="date">6</div>

            <div class="date">7</div>
            <div class="date">8</div>
            <div class="date">9</div>
            <div class="date">10</div>
            <div class="date">11</div>
            <div class="date">
                12
                <div class="event">Meeting</div>
            </div>
            <div class="date">13</div>

            <div class="date">14</div>
            <div class="date">15</div>
            <div class="date">16</div>
            <div class="date">17</div>
            <div class="date">18</div>
            <div class="date">19</div>
            <div class="date">20</div>

            <div class="date">21</div>
            <div class="date">22</div>
            <div class="date">23</div>
            <div class="date">24</div>
            <div class="date">25</div>
            <div class="date">26</div>
            <div class="date">27</div>

            <div class="date">28</div>
            <div class="date">29</div>
            <div class="date">30</div>

        </div>

    </div>

</div>

</body>
</html>
