<!DOCTYPE html>
<html>
<head>
    <title>CSS 78 - Error Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            text-align: center;
        }

        .error {
            margin-top: 100px;
        }

        .number {
            font-size: 100px;
            font-weight: bold;
            color: #2563eb;
        }

        h1 {
            color: #172554;
        }

        p {
            color: #64748b;
        }

        button {
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        .navigation {
            margin: 70px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="error">

        <div class="number">404</div>

        <h1>Page Not Found</h1>

        <p>
            Sorry, the page you are looking for does not exist.
        </p>

        <button>Go Home</button>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
