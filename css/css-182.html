<!DOCTYPE html>
<html>
<head>
<title>CSS 182 - Customer Support</title>
<style>
body{margin:0;font-family:Arial;background:#f5f7fb}
.navigation{padding:20px;background:white}
.navigation a{margin-right:20px;color:#2563eb}
.support{max-width:800px;margin:40px auto;background:white;padding:30px;border-radius:15px}
.ticket{padding:20px;border-bottom:1px solid #eee}
.ticket h3{color:#2563eb}
.badge{padding:6px 12px;border-radius:20px;background:#fef3c7;color:#92400e}
.resolved{background:#dcfce7;color:#15803d}
</style>
</head>
<body>

<div class="navigation">
<a href="../index.html">Home</a>
<a href="index.html">Back to CSS Programs</a>
</div>

<div class="support">
<h1>Support Tickets</h1>

<div class="ticket">
<h3>Login Problem</h3>
<p>User cannot access the account.</p>
<span class="badge">Pending</span>
</div>

<div class="ticket">
<h3>Payment Issue</h3>
<p>Payment confirmation required.</p>
<span class="badge">Pending</span>
</div>

<div class="ticket">
<h3>Password Reset</h3>
<p>Password reset request completed.</p>
<span class="badge resolved">Resolved</span>
</div>

</div>

</body>
</html>
