<!DOCTYPE html>
<html>
<head>
    <title>CSS 111 - Activity Timeline</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            text-decoration: none;
            color: #2563eb;
        }

        .timeline {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .event {
            border-left: 3px solid #2563eb;
            padding: 0 0 35px 30px;
            position: relative;
        }

        .event::before {
            content: "";
            position: absolute;
            left: -10px;
            top: 0;
            width: 17px;
            height: 17px;
            background: #2563eb;
            border-radius: 50%;
        }

        .event h3 {
            margin-top: 0;
        }

        .event p {
            color: #667085;
        }
    </style>
</head>
<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="timeline">

    <div class="event">
        <h3>Project Started</h3>
        <p>January 10, 2026</p>
    </div>

    <div class="event">
        <h3>Design Completed</h3>
        <p>January 20, 2026</p>
    </div>

    <div class="event">
        <h3>Development Started</h3>
        <p>February 5, 2026</p>
    </div>

    <div class="event">
        <h3>Project Completed</h3>
        <p>March 1, 2026</p>
    </div>

</div>

</body>
</html>
