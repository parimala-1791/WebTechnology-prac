<!DOCTYPE html>
<html>
<head>
    <title>CSS 63 - Avatar Group</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
        }

        .container {
            margin-top: 80px;
        }

        h1 {
            color: #172554;
        }

        .avatars {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }

        .avatar {
            width: 70px;
            height: 70px;
            margin-left: -15px;
            border: 4px solid white;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }

        .avatar:first-child {
            margin-left: 0;
        }

        .more {
            background: #172554;
        }

        .navigation {
            margin: 70px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Team Members</h1>

        <div class="avatars">
            <div class="avatar">A</div>
            <div class="avatar">P</div>
            <div class="avatar">R</div>
            <div class="avatar">S</div>
            <div class="avatar more">+5</div>
        </div>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
