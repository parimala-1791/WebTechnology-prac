<!DOCTYPE html>
<html>
<head>
    <title>CSS 140 - Loading Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #172033;
            color: white;
        }

        .navigation {
            padding: 20px;
        }

        .navigation a {
            margin-right: 20px;
            color: #93c5fd;
        }

        .loader-box {
            text-align: center;
            margin-top: 120px;
        }

        .loader {
            width: 70px;
            height: 70px;
            border: 8px solid #334155;
            border-top-color: #60a5fa;
            border-radius: 50%;
            margin: 30px auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="loader-box">

    <h1>Loading Dashboard</h1>

    <div class="loader"></div>

    <p>Please wait...</p>

</div>

</body>
</html>
