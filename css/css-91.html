<!DOCTYPE html>
<html>
<head>
    <title>CSS 91 - KPI Card</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }

        .kpi {
            width: 350px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px #cbd5e1;
        }

        .title {
            color: #64748b;
            font-size: 16px;
        }

        .number {
            font-size: 42px;
            font-weight: bold;
            color: #172554;
            margin: 15px 0;
        }

        .change {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .description {
            margin-top: 18px;
            color: #64748b;
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="kpi">

        <div class="title">Monthly Revenue</div>

        <div class="number">₹2,48,500</div>

        <div class="change">▲ 14.2%</div>

        <p class="description">
            Compared with the previous month.
        </p>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
