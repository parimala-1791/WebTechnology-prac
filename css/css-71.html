<!DOCTYPE html>
<html>
<head>
    <title>CSS 71 - Notification Center</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .container {
            width: 500px;
            margin: 50px auto;
        }

        h1 {
            color: #172554;
            text-align: center;
        }

        .notification {
            background: white;
            padding: 18px;
            margin: 12px 0;
            border-radius: 10px;
            box-shadow: 0 3px 10px #cbd5e1;
        }

        .notification h3 {
            margin: 0 0 8px;
            color: #2563eb;
        }

        .notification p {
            margin: 0;
            color: #64748b;
        }

        .time {
            display: block;
            margin-top: 8px;
            font-size: 12px;
            color: #94a3b8;
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Notification Center</h1>

        <div class="notification">
            <h3>🔔 New Message</h3>
            <p>You have received a new message.</p>
            <span class="time">5 minutes ago</span>
        </div>

        <div class="notification">
            <h3>✓ Task Completed</h3>
            <p>Your project task has been completed.</p>
            <span class="time">20 minutes ago</span>
        </div>

        <div class="notification">
            <h3>📢 New Update</h3>
            <p>A new version of the application is available.</p>
            <span class="time">1 hour ago</span>
        </div>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
