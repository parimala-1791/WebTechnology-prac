<!DOCTYPE html>
<html>
<head>
    <title>CSS 108 - Dashboard Sidebar</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 230px;
            height: 100vh;
            background: #172033;
            padding: 30px 20px;
        }

        .sidebar h2 {
            color: white;
            margin-bottom: 35px;
        }

        .sidebar a {
            display: block;
            padding: 14px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .sidebar a:hover {
            background: #2563eb;
            color: white;
        }

        .content {
            margin-left: 230px;
            padding: 40px;
        }

        .navigation {
            margin-bottom: 30px;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
        }

        @media(max-width: 700px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <h2>DashPro</h2>

    <a href="#">Dashboard</a>
    <a href="#">Analytics</a>
    <a href="#">Projects</a>
    <a href="#">Messages</a>
    <a href="#">Settings</a>
</aside>

<main class="content">

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

    <h1>Dashboard</h1>
    <p>Welcome to your dashboard.</p>

</main>

</body>
</html>
