<!DOCTYPE html>
<html>
<head>
    <title>CSS 57 - Progress Bar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }

        .container {
            max-width: 600px;
            margin: 70px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px #cbd5e1;
        }

        h1 {
            text-align: center;
            color: #172554;
        }

        .label {
            margin-top: 25px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .bar {
            width: 100%;
            height: 25px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: #2563eb;
            border-radius: 20px;
        }

        .p1 {
            width: 80%;
        }

        .p2 {
            width: 60%;
        }

        .p3 {
            width: 40%;
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Progress Bars</h1>

        <div class="label">HTML - 80%</div>
        <div class="bar">
            <div class="progress p1"></div>
        </div>

        <div class="label">CSS - 60%</div>
        <div class="bar">
            <div class="progress p2"></div>
        </div>

        <div class="label">JavaScript - 40%</div>
        <div class="bar">
            <div class="progress p3"></div>
        </div>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
