<!DOCTYPE html>
<html>
<head>
    <title>CSS 67 - Profile Header</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .profile-header {
            background: #172554;
            color: white;
            padding: 50px;
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            margin: auto;
            background: white;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: bold;
        }

        .profile-header h1 {
            margin-bottom: 5px;
        }

        .profile-header p {
            color: #dbeafe;
        }

        .content {
            max-width: 700px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="profile-header">

        <div class="avatar">P</div>

        <h1>Parimala Nakka</h1>

        <p>Computing & Data Science Student</p>

    </div>

    <div class="content">

        <h2>About Me</h2>

        <p>
            I am interested in programming, data science,
            web development and technology.
        </p>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
