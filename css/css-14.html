<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 14 - Box Sizing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        .box {
            width: 100%;
            padding: 30px;
            border: 8px solid #2563eb;
            margin: 20px 0;
        }

        .content-box {
            box-sizing: content-box;
            background: #dbeafe;
        }

        .border-box {
            box-sizing: border-box;
            background: #dcfce7;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS Box Sizing</h1>
</header>

<div class="content">

    <div class="box content-box">
        box-sizing: content-box
    </div>

    <div class="box border-box">
        box-sizing: border-box
    </div>

    <p>
        The border-box model includes padding and border
        within the declared width and height.
    </p>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
