<!DOCTYPE html>
<html>
<head>
    <title>CSS 53 - Profile Card</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #dbeafe;
        }

        .profile {
            width: 300px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 5px 20px #94a3b8;
        }

        .avatar {
            width: 100px;
            height: 100px;
            margin: auto;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: bold;
        }

        h2 {
            color: #172554;
        }

        p {
            color: #64748b;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #172554;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="profile">

        <div class="avatar">P</div>

        <h2>Parimala</h2>

        <p>Computing & Data Science Student</p>

        <button>View Profile</button>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
