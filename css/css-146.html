<!DOCTYPE html>
<html>
<head>

    <style>

            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
        }

        .rating {

            max-width: 90%;
            margin: 80px auto;

            padding: 40px;
            border-radius: 15px;
            text-align: center;
        }

        .stars {
            font-size: 45px;
            color: #f59e0b;
            letter-spacing: 5px;
        }

        p {
            color: #667085;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="rating">

    <h1>Rate Our Service</h1>

    <div class="stars">
        ★ ★ ★ ★ ★

    <p>5 out of 5 stars</p>

</div>

</body>
</html>
