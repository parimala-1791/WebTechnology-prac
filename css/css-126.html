<!DOCTYPE html>
<html>
<head>
    <title>CSS 126 - Notification Center</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
        }

        .notifications {
            max-width: 650px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        .notification {
            display: flex;
            gap: 15px;
            padding: 18px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .icon {
            width: 45px;
            height: 45px;
            background: #dbeafe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notification p {
            color: #667085;
            margin: 5px 0;
        }

        .time {
            font-size: 12px;
            color: #98a2b3;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="notifications">

    <h1>Notifications</h1>

    <div class="notification">
        <div class="icon">✓</div>
        <div>
            <strong>Payment Successful</strong>
            <p>Your payment was completed.</p>
            <span class="time">5 minutes ago</span>
        </div>
    </div>

    <div class="notification">
        <div class="icon">👤</div>
        <div>
            <strong>New User</strong>
            <p>A new user joined your team.</p>
            <span class="time">1 hour ago</span>
        </div>
    </div>

    <div class="notification">
        <div class="icon">📊</div>
        <div>
            <strong>Report Ready</strong>
            <p>Your monthly report is available.</p>
            <span class="time">2 hours ago</span>
        </div>
    </div>

</div>

</body>
</html>
