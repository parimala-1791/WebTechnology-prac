<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 24 - z-index</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        .area {
            height: 300px;
            position: relative;
            border: 2px solid #999;
        }

        .box {
            width: 180px;
            height: 120px;
            position: absolute;
            padding: 20px;
            box-sizing: border-box;
            color: white;
        }

        .one {
            background: #2563eb;
            top: 50px;
            left: 100px;
            z-index: 1;
        }

        .two {
            background: #dc2626;
            top: 100px;
            left: 160px;
            z-index: 2;
        }

        .three {
            background: #16a34a;
            top: 150px;
            left: 220px;
            z-index: 3;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS z-index</h1>
    <p>Controlling the stacking order of elements</p>
</header>

<div class="content">

    <div class="area">

        <div class="box one">
            z-index: 1
        </div>

        <div class="box two">
            z-index: 2
        </div>

        <div class="box three">
            z-index: 3
        </div>

    </div>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
