<!DOCTYPE html>
<html>
<head>
    <title>CSS 233 - SaaS Reports Page</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6fa;
        }

        nav {
            background: #172033;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .reports {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .report {
            background: white;
            padding: 25px;
            border-radius: 16px;
        }

        .report-icon {
            font-size: 35px;
        }

        button {
            padding: 10px 18px;
            background: #4f46e5;
            border: none;
            color: white;
            border-radius: 7px;
        }
    </style>
</head>
<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="container">

    <h1>Reports</h1>

    <div class="reports">

        <div class="report">
            <div class="report-icon">📊</div>
            <h2>Analytics Report</h2>
            <p>Monthly performance analytics.</p>
            <button>View Report</button>
        </div>

        <div class="report">
            <div class="report-icon">💰</div>
            <h2>Revenue Report</h2>
            <p>Detailed revenue information.</p>
            <button>View Report</button>
        </div>

        <div class="report">
            <div class="report-icon">👥</div>
            <h2>Customer Report</h2>
            <p>Customer engagement statistics.</p>
            <button>View Report</button>
        </div>

    </div>

</div>

</body>
</html>
