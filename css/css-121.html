<!DOCTYPE html>
<html>
<head>
    <title>CSS 121 - Admin Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
        }

        .sidebar {
            position: fixed;
            width: 220px;
            height: 100vh;
            background: #172033;
            padding: 25px 15px;
            color: white;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            padding: 13px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .sidebar a:hover {
            background: #2563eb;
            color: white;
        }

        .main {
            margin-left: 220px;
            padding: 30px;
        }

        .top {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.06);
        }

        .card h2 {
            color: #2563eb;
            font-size: 30px;
        }

        .navigation {
            margin-bottom: 20px;
        }

        .navigation a {
            color: #2563eb;
            margin-right: 20px;
        }

        @media(max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 600px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .main {
                margin-left: 0;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<aside class="sidebar">
    <h2>AdminPro</h2>
    <a href="#">Dashboard</a>
    <a href="#">Users</a>
    <a href="#">Analytics</a>
    <a href="#">Orders</a>
    <a href="#">Settings</a>
</aside>

<main class="main">

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

    <div class="top">
        <h1>Admin Dashboard</h1>
        <p>Overview of your business.</p>
    </div>

    <div class="cards">

        <div class="card">
            <p>Users</p>
            <h2>12,450</h2>
        </div>

        <div class="card">
            <p>Revenue</p>
            <h2>$48K</h2>
        </div>

        <div class="card">
            <p>Orders</p>
            <h2>3,250</h2>
        </div>

        <div class="card">
            <p>Growth</p>
            <h2>24%</h2>
        </div>

    </div>

</main>

</body>
</html>
