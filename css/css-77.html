<!DOCTYPE html>
<html>
<head>
    <title>CSS 77 - Confirmation Card</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .confirmation {
            width: 400px;
            margin: 80px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px #cbd5e1;
        }

        .check {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }

        h1 {
            color: #172554;
        }

        p {
            color: #64748b;
        }

        button {
            padding: 11px 25px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 7px;
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="confirmation">

        <div class="check">✓</div>

        <h1>Success!</h1>

        <p>
            Your request has been completed successfully.
        </p>

        <button>Continue</button>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
