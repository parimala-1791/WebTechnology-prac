<!DOCTYPE html>
<html>
<head>
    <title>CSS 102 - Feature Section</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f8fc;
        }

        header {
            text-align: center;
            padding: 60px 20px 30px;
        }

        header h1 {
            font-size: 40px;
            color: #172033;
        }

        header p {
            color: #667085;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding: 40px 8%;
        }

        .feature {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .feature:hover {
            transform: translateY(-8px);
        }

        .icon {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .feature h2 {
            color: #2563eb;
        }

        .feature p {
            color: #667085;
            line-height: 1.6;
        }

        @media(max-width: 800px) {
            .features {
                grid-template-columns: 1fr;
            }
        }

        .navigation {
            padding: 20px;
            text-align: center;
        }

        .navigation a {
            margin: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>
<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<header>
    <h1>Powerful Features</h1>
    <p>Everything you need to manage your workflow.</p>
</header>

<section class="features">

    <div class="feature">
        <div class="icon">📊</div>
        <h2>Analytics</h2>
        <p>Understand your business using detailed analytics.</p>
    </div>

    <div class="feature">
        <div class="icon">⚡</div>
        <h2>Fast Performance</h2>
        <p>Experience a fast and responsive application.</p>
    </div>

    <div class="feature">
        <div class="icon">🔒</div>
        <h2>Security</h2>
        <p>Keep your important information protected.</p>
    </div>

</section>

</body>
</html>
