<!DOCTYPE html>
<html>
<head>
    <title>CSS 242 - SaaS Product Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f5f7fb;
        }

        nav {
            background: #172033;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .product {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(0,0,0,.07);
        }

        .product-icon {
            font-size: 40px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
        }

        .tag {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #e0e7ff;
            color: #4338ca;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #4f46e5;
            color: white;
            border-radius: 8px;
        }

        @media(max-width:750px) {
            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="container">

    <h1>Products</h1>

    <div class="products">

        <div class="product">
            <div class="product-icon">💻</div>
            <span class="tag">Popular</span>
            <h2>Analytics Pro</h2>
            <p>Advanced analytics tools.</p>
            <div class="price">$29</div>
            <p>per month</p>
            <button>View Product</button>
        </div>

        <div class="product">
            <div class="product-icon">🤖</div>
            <span class="tag">AI</span>
            <h2>AI Assistant</h2>
            <p>Intelligent business assistant.</p>
            <div class="price">$39</div>
            <p>per month</p>
            <button>View Product</button>
        </div>

        <div class="product">
            <div class="product-icon">☁️</div>
            <span class="tag">Cloud</span>
            <h2>Cloud Storage</h2>
            <p>Secure cloud storage.</p>
            <div class="price">$19</div>
            <p>per month</p>
            <button>View Product</button>
        </div>

    </div>

</div>

</body>
</html>
