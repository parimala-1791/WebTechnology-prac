<!DOCTYPE html>
<html>
<head>
    <title>CSS 101 - SaaS Hero Section</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        nav {
            padding: 20px 8%;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: #2563eb;
        }

        nav a {
            text-decoration: none;
            margin-left: 20px;
            color: #333;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 8%;
            gap: 40px;
        }

        .hero-text {
            max-width: 550px;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #2563eb;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.7;
            color: #667085;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 25px;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }

        .hero-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }

        .hero-card h2 {
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .hero {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<nav>
    <h2>CloudFlow</h2>
    <div>
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>
</nav>

<section class="hero">
    <div class="hero-text">
        <h1>Build Better <span>Digital Products</span></h1>
        <p>
            A modern SaaS platform designed to help teams manage
            projects, analytics and productivity from one place.
        </p>
        <a href="#" class="btn">Get Started</a>
    </div>

    <div class="hero-card">
        <h2>Dashboard</h2>
        <p>Track your business performance with powerful analytics.</p>
    </div>
</section>

</body>
</html>
