<!DOCTYPE html>
<html>
<head>
    <title>CSS 54 - Testimonial Card</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .container {
            max-width: 500px;
            margin: 70px auto;
        }

        .testimonial {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #cbd5e1;
        }

        .quote {
            font-size: 50px;
            color: #2563eb;
        }

        .message {
            color: #475569;
            font-size: 17px;
            line-height: 1.7;
            font-style: italic;
        }

        .name {
            color: #172554;
            font-weight: bold;
            margin-top: 20px;
        }

        .role {
            color: #64748b;
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="testimonial">

            <div class="quote">“</div>

            <p class="message">
                This website is simple, beautiful and easy to use.
                I really enjoyed working with this design.
            </p>

            <div class="name">Ananya</div>
            <div class="role">Web Developer</div>

        </div>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
