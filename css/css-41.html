<!DOCTYPE html>
<html>
<head>
    <title>CSS 41 - Signup Form</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eff6ff;
        }

        .signup {
            width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px #cbd5e1;
        }

        h1 {
            text-align: center;
            color: #172554;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        .terms {
            margin-top: 15px;
        }

        .terms input {
            width: auto;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #172554;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }

        @media (max-width: 500px) {
            .signup {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="signup">

        <h1>Create Account</h1>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" placeholder="Create password">

            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm password">

            <div class="terms">
                <input type="checkbox">
                I agree to the terms and conditions
            </div>

            <button type="submit">Sign Up</button>

        </form>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
