<!DOCTYPE html>
<html>
<head>
    <title>CSS 269 - SaaS Modern Webpage</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            color: #172033;
        }

        nav {
            padding: 20px 8%;
            background: #111827;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .hero {
            padding: 100px 8%;
            background: linear-gradient(120deg,#eef2ff,#ffffff);
            text-align: center;
        }

        .hero h1 {
            font-size: 55px;
        }

        .hero p {
            max-width: 650px;
            margin: auto;
            line-height: 1.7;
        }

        button {
            margin-top: 30px;
            padding: 15px 30px;
            background: #4f46e5;
            border: none;
            color: white;
            border-radius: 8px;
        }

        .features {
            padding: 60px 8%;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 25px;
        }

        .feature {
            padding: 30px;
            border-radius: 18px;
            background: #f8fafc;
        }

        @media(max-width:700px) {
            .features {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<section class="hero">

    <h1>Everything Your Team Needs</h1>

    <p>
        One modern platform for projects, analytics,
        communication and business growth.
    </p>

    <button>Get Started</button>

</section>

<section class="features">

    <div class="feature">
        <h2>Fast</h2>
        <p>Designed for speed and productivity.</p>
    </div>

    <div class="feature">
        <h2>Secure</h2>
        <p>Your business data stays protected.</p>
    </div>

    <div class="feature">
        <h2>Scalable</h2>
        <p>Grow your platform with your business.</p>
    </div>

</section>

</body>
</html>
