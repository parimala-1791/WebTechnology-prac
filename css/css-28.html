<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 28 - Spacing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        .box {
            background: #dbeafe;
            border: 2px solid #2563eb;
            margin: 30px;
            padding: 25px;
            text-align: center;
        }

        .small {
            margin: 10px;
            padding: 10px;
        }

        .large {
            margin: 40px;
            padding: 35px;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS Spacing</h1>
    <p>Margin and Padding</p>
</header>

<div class="content">

    <div class="box small">
        Small margin and padding
    </div>

    <div class="box large">
        Large margin and padding
    </div>

    <p>
        Margin creates space outside an element,
        while padding creates space inside an element.
    </p>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
