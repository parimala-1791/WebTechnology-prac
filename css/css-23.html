<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 23 - Positioning</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        .box {
            height: 300px;
            position: relative;
            border: 2px solid #2563eb;
        }

        .static {
            position: static;
            background: #dbeafe;
            padding: 15px;
        }

        .absolute {
            position: absolute;
            right: 20px;
            top: 100px;
            background: #fef3c7;
            padding: 15px;
        }

        .fixed {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #172554;
            color: white;
            padding: 12px;
            border-radius: 8px;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS Positioning</h1>
</header>

<div class="content">

    <div class="box">

        <div class="static">
            Static Position
        </div>

        <div class="absolute">
            Absolute Position
        </div>

    </div>

</div>

<div class="fixed">
    Fixed Element
</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
