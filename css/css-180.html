<!DOCTYPE html>
<html>
<head>
<title>CSS 180 - Activity Dashboard</title>
<style>
body{margin:0;font-family:Arial;background:#f5f7fb}
.navigation{padding:20px;background:white}
.navigation a{margin-right:20px;color:#2563eb}
.activity{max-width:700px;margin:40px auto;background:white;padding:30px;border-radius:15px}
.item{display:flex;gap:20px;padding:20px 0;border-bottom:1px solid #eee}
.icon{width:45px;height:45px;background:#dbeafe;border-radius:50%;display:flex;align-items:center;justify-content:center}
.item p{color:#667085}
.time{font-size:12px;color:#98a2b3}
</style>
</head>
<body>

<div class="navigation">
<a href="../index.html">Home</a>
<a href="index.html">Back to CSS Programs</a>
</div>

<div class="activity">
<h1>Recent Activity</h1>

<div class="item">
<div class="icon">✓</div>
<div><strong>Project completed</strong><p>Website project was completed.</p><span class="time">10 minutes ago</span></div>
</div>

<div class="item">
<div class="icon">👤</div>
<div><strong>New user joined</strong><p>A new member joined your team.</p><span class="time">1 hour ago</span></div>
</div>

<div class="item">
<div class="icon">💰</div>
<div><strong>Payment received</strong><p>A payment of $500 was received.</p><span class="time">2 hours ago</span></div>
</div>

</div>

</body>
</html>
