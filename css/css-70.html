<!DOCTYPE html>
<html>
<head>
    <title>CSS 70 - Blog Card</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .blog {
            width: 500px;
            margin: 60px auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px #cbd5e1;
        }

        .blog img {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }

        .content {
            padding: 25px;
        }

        .category {
            color: #2563eb;
            font-size: 14px;
            font-weight: bold;
        }

        h1 {
            color: #172554;
        }

        .content p {
            color: #64748b;
            line-height: 1.6;
        }

        .read {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        .read:hover {
            background: #172554;
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }

        @media (max-width: 550px) {
            .blog {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="blog">

        <img src="https://picsum.photos/600/350" alt="Blog Image">

        <div class="content">

            <div class="category">WEB DEVELOPMENT</div>

            <h1>Learning CSS Basics</h1>

            <p>
                CSS helps developers create attractive,
                responsive and user-friendly websites.
            </p>

            <a href="#" class="read">Read More</a>

        </div>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
