<!DOCTYPE html>
<html>
<head>
    <title>CSS 220 - SaaS Search Interface</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
        }

        nav {
            background: #111827;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .search {
            display: flex;
            gap: 10px;
            margin: 30px 0;
        }

        input {
            flex: 1;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 15px 25px;
            border: none;
            background: #4f46e5;
            color: white;
            border-radius: 10px;
        }

        .result {
            background: white;
            padding: 25px;
            margin: 15px 0;
            border-radius: 14px;
        }

        .result h2 {
            margin-bottom: 8px;
        }

        .tag {
            display: inline-block;
            padding: 5px 10px;
            background: #e0e7ff;
            color: #4338ca;
            border-radius: 20px;
            font-size: 12px;
        }

        @media(max-width:600px) {
            .search {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="container">

    <h1>Search</h1>

    <div class="search">
        <input type="text" placeholder="Search projects, users, reports...">
        <button>Search</button>
    </div>

    <div class="result">
        <span class="tag">Project</span>
        <h2>Analytics Dashboard</h2>
        <p>Complete analytics dashboard project.</p>
    </div>

    <div class="result">
        <span class="tag">Report</span>
        <h2>Monthly Revenue Report</h2>
        <p>Revenue performance for the current month.</p>
    </div>

    <div class="result">
        <span class="tag">User</span>
        <h2>Customer Analytics</h2>
        <p>Customer behavior and engagement data.</p>
    </div>

</div>

</body>
</html>
