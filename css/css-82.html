<!DOCTYPE html>
<html>
<head>
    <title>CSS 82 - Price Comparison</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        h1 {
            text-align: center;
            color: #172554;
            margin-top: 40px;
        }

        .plans {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            flex-wrap: wrap;
        }

        .plan {
            width: 250px;
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 4px 12px #cbd5e1;
        }

        .plan h2 {
            color: #2563eb;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
            color: #172554;
        }

        .plan ul {
            list-style: none;
            padding: 0;
            line-height: 2;
            color: #64748b;
        }

        .plan button {
            padding: 10px 20px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <h1>Compare Plans</h1>

    <div class="plans">

        <div class="plan">
            <h2>Basic</h2>
            <div class="price">₹199</div>

            <ul>
                <li>5 Projects</li>
                <li>1 GB Storage</li>
                <li>Email Support</li>
            </ul>

            <button>Select</button>
        </div>

        <div class="plan">
            <h2>Pro</h2>
            <div class="price">₹499</div>

            <ul>
                <li>20 Projects</li>
                <li>10 GB Storage</li>
                <li>Priority Support</li>
            </ul>

            <button>Select</button>
        </div>

        <div class="plan">
            <h2>Premium</h2>
            <div class="price">₹999</div>

            <ul>
                <li>Unlimited Projects</li>
                <li>100 GB Storage</li>
                <li>24/7 Support</li>
            </ul>

            <button>Select</button>
        </div>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
