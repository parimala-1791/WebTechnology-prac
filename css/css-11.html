<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 11 - Text Properties</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        .center {
            text-align: center;
        }

        .uppercase {
            text-transform: uppercase;
        }

        .underline {
            text-decoration: underline;
        }

        .spacing {
            letter-spacing: 4px;
        }

        .line {
            line-height: 2;
        }

        .shadow {
            text-shadow: 2px 2px 4px #999;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS Text Properties</h1>
</header>

<div class="content">

    <p class="center">
        This text is center aligned.
    </p>

    <p class="uppercase">
        this text is converted to uppercase.
    </p>

    <p class="underline">
        This text is underlined.
    </p>

    <p class="spacing">
        This text has letter spacing.
    </p>

    <p class="line">
        This paragraph demonstrates line height.
        CSS provides many properties to control
        the appearance of text.
    </p>

    <h2 class="shadow">
        Text Shadow Example
    </h2>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
