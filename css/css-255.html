<!DOCTYPE html>
<html>
<head>
    <title>CSS 255 - SaaS Customer Success</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6fa;
        }

        nav {
            background: #111827;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 1050px;
            margin: 50px auto;
            padding: 20px;
        }

        .hero {
            background: white;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .stat {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        .number {
            font-size: 38px;
            font-weight: bold;
            color: #4f46e5;
        }

        @media(max-width:650px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="container">

    <div class="hero">

        <h1>Customer Success</h1>

        <p>
            Helping our customers achieve more with our platform.
        </p>

    </div>

    <div class="stats">

        <div class="stat">
            <div class="number">98%</div>
            <p>Customer Satisfaction</p>
        </div>

        <div class="stat">
            <div class="number">94%</div>
            <p>Retention Rate</p>
        </div>

        <div class="stat">
            <div class="number">4.9/5</div>
            <p>Customer Rating</p>
        </div>

    </div>

</div>

</body>
</html>
