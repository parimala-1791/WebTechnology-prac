<!DOCTYPE html>
<html>
<head>
    <title>CSS 267 - SaaS Business Intelligence</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6fa;
        }

        nav {
            background: #172033;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
        }

        .metric {
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        .chart {
            margin-top: 30px;
            height: 250px;
            background: white;
            padding: 30px;
            display: flex;
            align-items: end;
            gap: 20px;
            border-radius: 15px;
        }

        .bar {
            flex: 1;
            background: #4f46e5;
        }

        .one { height: 40%; }
        .two { height: 65%; }
        .three { height: 55%; }
        .four { height: 85%; }
        .five { height: 70%; }

        @media(max-width:700px) {
            .metrics {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="container">

    <h1>Business Intelligence</h1>

    <div class="metrics">

        <div class="metric">
            <p>Revenue</p>
            <div class="number">$184K</div>
        </div>

        <div class="metric">
            <p>Profit</p>
            <div class="number">$82K</div>
        </div>

        <div class="metric">
            <p>Growth</p>
            <div class="number">24%</div>
        </div>

    </div>

    <div class="chart">

        <div class="bar one"></div>
        <div class="bar two"></div>
        <div class="bar three"></div>
        <div class="bar four"></div>
        <div class="bar five"></div>

    </div>

</div>

</body>
</html>
