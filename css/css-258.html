<!DOCTYPE html>
<html>
<head>
    <title>CSS 258 - SaaS Developer Homepage</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #0f172a;
            color: white;
        }

        nav {
            padding: 18px 8%;
            background: #020617;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .hero {
            padding: 100px 8%;
        }

        .hero h1 {
            font-size: 55px;
        }

        .hero p {
            color: #cbd5e1;
            max-width: 650px;
            line-height: 1.7;
        }

        .code {
            margin-top: 30px;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            font-family: monospace;
            color: #a5b4fc;
        }

        button {
            padding: 14px 25px;
            margin-top: 25px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<section class="hero">

    <h1>Build With Our API</h1>

    <p>
        Powerful APIs and developer tools for
        building modern applications.
    </p>

    <button>Read Documentation</button>

    <div class="code">
        GET /api/v1/users<br>
        Authorization: Bearer API_KEY<br>
        Response: 200 OK
    </div>

</section>

</html>
