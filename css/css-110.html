<!DOCTYPE html>
<html>
<head>
    <title>CSS 110 - Circular Progress</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            text-decoration: none;
            color: #2563eb;
        }

        .container {
            text-align: center;
            padding: 60px;
        }

        .circle {
            width: 220px;
            height: 220px;
            margin: 30px auto;
            border-radius: 50%;
            background: conic-gradient(#2563eb 0deg 288deg, #e5e7eb 288deg 360deg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .inner {
            width: 170px;
            height: 170px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="container">
    <h1>Project Completion</h1>

    <div class="circle">
        <div class="inner">80%</div>
    </div>

    <p>Your project is almost complete.</p>
</div>

</body>
</html>
