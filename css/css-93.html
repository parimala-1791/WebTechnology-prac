<!DOCTYPE html>
<html>
<head>
    <title>CSS 93 - Data Table</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }

        .container {
            width: 85%;
            margin: 50px auto;
        }

        h1 {
            color: #172554;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 12px #cbd5e1;
        }

        th {
            background: #172554;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:hover {
            background: #eff6ff;
        }

        .status {
            background: #dcfce7;
            color: #166534;
            padding: 6px 10px;
            border-radius: 15px;
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }

        @media (max-width: 600px) {
            .container {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Data</h1>

        <table>

            <tr>
                <th>Name</th>
                <th>Course</th>
                <th>Year</th>
                <th>Status</th>
            </tr>

            <tr>
                <td>Parimala</td>
                <td>Data Science</td>
                <td>2nd Year</td>
                <td><span class="status">Active</span></td>
            </tr>

            <tr>
                <td>Ananya</td>
                <td>Computer Science</td>
                <td>2nd Year</td>
                <td><span class="status">Active</span></td>
            </tr>

            <tr>
                <td>Rahul</td>
                <td>AI</td>
                <td>3rd Year</td>
                <td><span class="status">Active</span></td>
            </tr>

        </table>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
