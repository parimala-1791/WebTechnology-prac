<!DOCTYPE html>
<html>
<head>
    <title>CSS 241 - SaaS Analytics Overview</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #172033;
        }

        nav {
            background: #111827;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .number {
            font-size: 30px;
            font-weight: bold;
        }

        .growth {
            color: #16a34a;
            font-weight: bold;
        }

        .chart {
            margin-top: 30px;
            background: white;
            padding: 30px;
            border-radius: 16px;
        }

        .bar {
            height: 20px;
            background: #e5e7eb;
            border-radius: 20px;
            margin: 18px 0;
        }

        .bar span {
            display: block;
            height: 100%;
            background: #4f46e5;
            border-radius: 20px;
        }

        @media(max-width:800px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:500px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="container">

    <h1>Analytics Overview</h1>

    <div class="cards">

        <div class="card">
            <p>Visitors</p>
            <div class="number">48,520</div>
            <p class="growth">+18.4%</p>
        </div>

        <div class="card">
            <p>Customers</p>
            <div class="number">8,240</div>
            <p class="growth">+12.2%</p>
        </div>

        <div class="card">
            <p>Revenue</p>
            <div class="number">$92K</div>
            <p class="growth">+21.5%</p>
        </div>

        <div class="card">
            <p>Conversion</p>
            <div class="number">8.6%</div>
            <p class="growth">+3.1%</p>
        </div>

    </div>

    <div class="chart">

        <h2>Traffic Performance</h2>

        <p>January</p>
        <div class="bar"><span style="width:70%"></span></div>

        <p>February</p>
        <div class="bar"><span style="width:82%"></span></div>

        <p>March</p>
        <div class="bar"><span style="width:92%"></span></div>

    </div>

</div>

</body>
</html>
