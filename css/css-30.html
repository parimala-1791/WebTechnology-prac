<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 30 - Object Fit</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        .images {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .image-box {
            width: 250px;
            height: 200px;
            border: 2px solid #2563eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
        }

        .cover img {
            object-fit: cover;
        }

        .contain img {
            object-fit: contain;
        }

        .fill img {
            object-fit: fill;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS object-fit</h1>
    <p>Controlling how images fit inside containers</p>
</header>

<div class="content">

    <div class="images">

        <div class="image-box cover">
            <img src="https://picsum.photos/500/300"
                 alt="Object Fit Cover">
        </div>

        <div class="image-box contain">
            <img src="https://picsum.photos/500/300"
                 alt="Object Fit Contain">
        </div>

        <div class="image-box fill">
            <img src="https://picsum.photos/500/300"
                 alt="Object Fit Fill">
        </div>

    </div>

    <p style="text-align:center;">
        The examples demonstrate cover, contain and fill.
    </p>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
