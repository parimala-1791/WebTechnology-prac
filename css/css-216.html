<!DOCTYPE html>
<html>
<head>
    <title>CSS 216 - SaaS Workspace</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
        }

        nav {
            background: #111827;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .workspace {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .project {
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        .progress {
            height: 10px;
            background: #e5e7eb;
            border-radius: 20px;
            margin-top: 20px;
        }

        .progress span {
            display: block;
            height: 100%;
            width: 75%;
            background: #4f46e5;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="workspace">

    <div class="header">
        <h1>My Workspace</h1>
        <button>+ New Project</button>
    </div>

    <div class="projects">

        <div class="project">
            <h2>Website Project</h2>
            <p>12 tasks remaining</p>
            <div class="progress"><span></span></div>
        </div>

        <div class="project">
            <h2>Mobile App</h2>
            <p>8 tasks remaining</p>
            <div class="progress"><span style="width:60%"></span></div>
        </div>

        <div class="project">
            <h2>Marketing</h2>
            <p>5 tasks remaining</p>
            <div class="progress"><span style="width:90%"></span></div>
        </div>

    </div>

</div>

</body>
</html>
