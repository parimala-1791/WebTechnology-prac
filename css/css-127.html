<!DOCTYPE html>
<html>
<head>
    <title>CSS 127 - Search Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
        }

        .search-box {
            max-width: 700px;
            margin: 60px auto;
            text-align: center;
        }

        input {
            width: 80%;
            padding: 15px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 16px;
        }

        .results {
            margin-top: 30px;
            text-align: left;
        }

        .result {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .result h3 {
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="search-box">

    <h1>Search Dashboard</h1>

    <input type="search" placeholder="Search projects...">

    <div class="results">

        <div class="result">
            <h3>Website Project</h3>
            <p>Frontend development project.</p>
        </div>

        <div class="result">
            <h3>Analytics Dashboard</h3>
            <p>Business analytics project.</p>
        </div>

        <div class="result">
            <h3>Mobile Application</h3>
            <p>Application development project.</p>
        </div>

    </div>

</div>

</body>
</html>
