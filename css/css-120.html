<!DOCTYPE html>
<html>
<head>
    <title>CSS 120 - Profile Settings</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            text-decoration: none;
            color: #2563eb;
        }

        .profile {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: #dbeafe;
            border-radius: 50%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="profile">

    <div class="profile-header">
        <div class="avatar">👩</div>
        <h1>Profile Settings</h1>
        <p>Update your personal information.</p>
    </div>

    <label>Name</label>
    <input type="text" value="Parimala">

    <label>Email</label>
    <input type="email" value="parimala@example.com">

    <label>Role</label>
    <input type="text" value="Computing and Data Science Student">

    <button>Save Changes</button>

</div>

</body>
</html>
