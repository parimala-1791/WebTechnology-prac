<!DOCTYPE html>
<html>
<head>
    <title>CSS 49 - Badges</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #172554;
        }

        .badge {
            display: inline-block;
            padding: 8px 15px;
            margin: 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .info {
            background: #dbeafe;
            color: #1e40af;
        }

        .warning {
            background: #fef3c7;
            color: #92400e;
        }

        .danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .dark {
            background: #172554;
            color: white;
        }

        .navigation {
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CSS Badges</h1>

        <span class="badge success">Active</span>
        <span class="badge info">New</span>
        <span class="badge warning">Pending</span>
        <span class="badge danger">Error</span>
        <span class="badge dark">Premium</span>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
