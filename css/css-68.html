<!DOCTYPE html>
<html>
<head>
    <title>CSS 68 - Image Card</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .card {
            width: 350px;
            margin: 60px auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px #cbd5e1;
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .content {
            padding: 25px;
        }

        .content h2 {
            color: #172554;
        }

        .content p {
            color: #64748b;
            line-height: 1.5;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #172554;
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="https://picsum.photos/500/300" alt="Sample Image">

        <div class="content">

            <h2>Beautiful Image</h2>

            <p>
                This card demonstrates how an image can be
                combined with content using CSS.
            </p>

            <button>Read More</button>

        </div>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
