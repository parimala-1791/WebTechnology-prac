<!DOCTYPE html>
<html>
<head>
    <title>CSS 47 - Breadcrumbs</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }

        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 30px;
        }

        h1 {
            color: #172554;
        }

        .breadcrumb {
            background: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #cbd5e1;
        }

        .breadcrumb a {
            color: #2563eb;
            text-decoration: none;
        }

        .breadcrumb span {
            margin: 0 10px;
            color: #64748b;
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Breadcrumb Navigation</h1>

        <div class="breadcrumb">
            <a href="#">Home</a>
            <span>›</span>
            <a href="#">Products</a>
            <span>›</span>
            <a href="#">Electronics</a>
            <span>›</span>
            <b>Mobile Phones</b>
        </div>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
