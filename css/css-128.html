<!DOCTYPE html>
<html>
<head>
    <title>CSS 128 - User Profile Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
        }

        .profile {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            background: #dbeafe;
            border-radius: 50%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .stat {
            background: #f5f7fb;
            padding: 20px;
            border-radius: 10px;
        }

        .stat h2 {
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="profile">

    <div class="avatar">👩</div>

    <h1>Parimala</h1>
    <p>Computing and Data Science Student</p>

    <div class="stats">

        <div class="stat">
            <h2>42</h2>
            <p>Projects</p>
        </div>

        <div class="stat">
            <h2>18</h2>
            <p>Certificates</p>
        </div>

        <div class="stat">
            <h2>25</h2>
            <p>Skills</p>
        </div>

    </div>

</div>

</body>
</html>
