<!DOCTYPE html>
<html>
<head>
    <title>CSS 116 - Data Table</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        .container {
            padding: 50px 8%;
        }

        .table-container {
            overflow-x: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #eff6ff;
            color: #1d4ed8;
        }

        tr:hover {
            background: #f9fafb;
        }
    </style>
</head>
<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="container">

    <h1>User Data</h1>

    <div class="table-container">

        <table>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
            </tr>

            <tr>
                <td>Priya</td>
                <td>priya@email.com</td>
                <td>Designer</td>
                <td>Active</td>
            </tr>

            <tr>
                <td>Rahul</td>
                <td>rahul@email.com</td>
                <td>Developer</td>
                <td>Active</td>
            </tr>

            <tr>
                <td>Ananya</td>
                <td>ananya@email.com</td>
                <td>Manager</td>
                <td>Inactive</td>
            </tr>
        </table>

    </div>

</div>

</body>
</html>
