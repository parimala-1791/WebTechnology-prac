<!DOCTYPE html>
<html>
<head>
    <title>CSS 114 - Avatar Group</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        .container {
            text-align: center;
            padding: 70px;
        }

        .avatars {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #dbeafe;
            border: 4px solid white;
            margin-left: -15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .more {
            background: #2563eb;
            color: white;
        }
    </style>
</head>
<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="container">

    <h1>Project Members</h1>

    <div class="avatars">
        <div class="avatar">👩</div>
        <div class="avatar">👨</div>
        <div class="avatar">👩</div>
        <div class="avatar">👨</div>
        <div class="avatar more">+5</div>
    </div>

</div>

</body>
</html>
