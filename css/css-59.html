<!DOCTYPE html>
<html>
<head>
    <title>CSS 59 - Skeleton Loader</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .card {
            width: 400px;
            margin: 60px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px #cbd5e1;
        }

        .skeleton {
            background: linear-gradient(
                90deg,
                #e2e8f0,
                #f8fafc,
                #e2e8f0
            );
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 6px;
        }

        .image {
            height: 180px;
            margin-bottom: 20px;
        }

        .title {
            width: 70%;
            height: 20px;
            margin-bottom: 15px;
        }

        .text {
            width: 100%;
            height: 15px;
            margin-bottom: 10px;
        }

        @keyframes loading {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="skeleton image"></div>

        <div class="skeleton title"></div>

        <div class="skeleton text"></div>
        <div class="skeleton text"></div>
        <div class="skeleton text"></div>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
