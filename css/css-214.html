<!DOCTYPE html>
<html>
<head>
    <title>CSS 214 - Conversion Analytics</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
        }

        nav {
            background: #111827;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .funnel {
            background: white;
            padding: 30px;
            border-radius: 18px;
        }

        .step {
            margin: 20px auto;
            padding: 20px;
            text-align: center;
            color: white;
            background: #4f46e5;
            border-radius: 8px;
        }

        .step1 { width: 100%; }
        .step2 { width: 80%; }
        .step3 { width: 60%; }
        .step4 { width: 40%; }
    </style>
</head>
<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="container">

    <div class="funnel">

        <h1>Conversion Funnel</h1>

        <div class="step step1">Visitors — 10,000</div>
        <div class="step step2">Product Views — 8,000</div>
        <div class="step step3">Cart Added — 6,000</div>
        <div class="step step4">Purchases — 4,000</div>

    </div>

</div>

</body>
</html>
