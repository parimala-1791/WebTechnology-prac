<!DOCTYPE html>
<html>
<head>
    <title>CSS 65 - Dashboard Card</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .dashboard {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
        }

        h1 {
            color: #172554;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #cbd5e1;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top h2 {
            color: #172554;
        }

        .value {
            font-size: 40px;
            font-weight: bold;
            color: #2563eb;
        }

        .change {
            color: #16a34a;
            font-weight: bold;
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }

        @media (max-width: 600px) {
            .top {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <h1>Dashboard</h1>

        <div class="card">

            <div class="top">
                <h2>Total Revenue</h2>
                <span class="change">+12.5%</span>
            </div>

            <div class="value">₹1,25,000</div>

            <p>
                Revenue generated during the current month.
            </p>

        </div>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
