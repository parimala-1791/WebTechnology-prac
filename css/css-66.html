<!DOCTYPE html>
<html>
<head>
    <title>CSS 66 - Notification Badge</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            text-align: center;
        }

        .container {
            margin-top: 80px;
        }

        h1 {
            color: #172554;
        }

        .notification {
            position: relative;
            display: inline-block;
            margin-top: 40px;
            font-size: 50px;
            cursor: pointer;
        }

        .badge {
            position: absolute;
            top: -8px;
            right: -12px;
            background: #dc2626;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .navigation {
            margin: 70px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Notification Badge</h1>

        <div class="notification">
            🔔
            <span class="badge">5</span>
        </div>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
