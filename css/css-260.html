<!DOCTYPE html>
<html>
<head>
    <title>CSS 260 - SaaS E-commerce Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6fa;
        }

        nav {
            background: #111827;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
        }

        .products {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
        }

        .product {
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        .price {
            font-size: 25px;
            font-weight: bold;
        }

        @media(max-width:800px) {
            .stats {
                grid-template-columns: repeat(2,1fr);
            }

            .products {
                grid-template-columns: 1fr;
            }
        }

        @media(max-width:500px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="container">

    <h1>E-commerce Dashboard</h1>

    <div class="stats">

        <div class="card">
            <p>Orders</p>
            <div class="number">1,240</div>
        </div>

        <div class="card">
            <p>Revenue</p>
            <div class="number">$52K</div>
        </div>

        <div class="card">
            <p>Customers</p>
            <div class="number">8,420</div>
        </div>

        <div class="card">
            <p>Products</p>
            <div class="number">340</div>
        </div>

    </div>

    <h2>Top Products</h2>

    <div class="products">

        <div class="product">
            <h2>Premium Headphones</h2>
            <div class="price">$129</div>
            <p>320 sold</p>
        </div>

        <div class="product">
            <h2>Smart Watch</h2>
            <div class="price">$199</div>
            <p>280 sold</p>
        </div>

        <div class="product">
            <h2>Wireless Speaker</h2>
            <div class="price">$89</div>
            <p>240 sold</p>
        </div>

    </div>

</div>

</body>
</html>
