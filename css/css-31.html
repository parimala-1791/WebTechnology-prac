<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 31 - Filters</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        .images {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .image-box {
            text-align: center;
        }

        img {
            width: 180px;
            height: 140px;
            object-fit: cover;
            border-radius: 10px;
        }

        .blur img {
            filter: blur(4px);
        }

        .gray img {
            filter: grayscale(100%);
        }

        .bright img {
            filter: brightness(150%);
        }

        .sepia img {
            filter: sepia(100%);
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS Filters</h1>
    <p>Applying visual effects to elements</p>
</header>

<div class="content">

    <div class="images">

        <div class="image-box">
            <img src="https://picsum.photos/300/200" alt="Normal">
            <p>Normal</p>
        </div>

        <div class="image-box blur">
            <img src="https://picsum.photos/300/200" alt="Blur">
            <p>Blur</p>
        </div>

        <div class="image-box gray">
            <img src="https://picsum.photos/300/200" alt="Grayscale">
            <p>Grayscale</p>
        </div>

        <div class="image-box bright">
            <img src="https://picsum.photos/300/200" alt="Brightness">
            <p>Brightness</p>
        </div>

        <div class="image-box sepia">
            <img src="https://picsum.photos/300/200" alt="Sepia">
            <p>Sepia</p>
        </div>

    </div>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
