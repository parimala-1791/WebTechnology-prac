<!DOCTYPE html>
<html>
<head>
    <title>CSS 104 - Testimonials</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f8fc;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            text-decoration: none;
            margin-right: 20px;
            color: #2563eb;
        }

        header {
            text-align: center;
            padding: 50px 20px;
        }

        .testimonials {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding: 20px 8%;
        }

        .testimonial {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .testimonial p {
            line-height: 1.7;
            color: #667085;
        }

        .user {
            margin-top: 20px;
            font-weight: bold;
            color: #2563eb;
        }

        @media(max-width: 800px) {
            .testimonials {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<header>
    <h1>What Our Customers Say</h1>
</header>

<section class="testimonials">

    <div class="testimonial">
        <p>
            "This platform completely improved the way our team works."
        </p>
        <div class="user">— Priya</div>
    </div>

    <div class="testimonial">
        <p>
            "The dashboard is simple, beautiful and very easy to use."
        </p>
        <div class="user">— Rahul</div>
    </div>

    <div class="testimonial">
        <p>
            "Our productivity increased significantly after using it."
        </p>
        <div class="user">— Ananya</div>
    </div>

</section>

</body>
</html>
