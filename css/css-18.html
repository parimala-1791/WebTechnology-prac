<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 18 - Border Radius</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        .box {
            padding: 30px;
            margin: 20px;
            background: #dbeafe;
            border: 3px solid #2563eb;
            text-align: center;
        }

        .small-radius {
            border-radius: 10px;
        }

        .large-radius {
            border-radius: 30px;
        }

        .circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px auto;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS Border Radius</h1>
</header>

<div class="content">

    <div class="box small-radius">
        Small Border Radius
    </div>

    <div class="box large-radius">
        Large Border Radius
    </div>

    <div class="circle">
        Circle
    </div>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
