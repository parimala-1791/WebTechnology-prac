<!DOCTYPE html>
<html>
<head>
    <title>CSS 244 - SaaS Customer Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f5f7fb;
        }

        nav {
            background: #172033;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .customer {
            background: white;
            padding: 30px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            background: #4f46e5;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }

        .stats {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .stat {
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        .number {
            font-size: 28px;
            font-weight: bold;
        }

        @media(max-width:800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:500px) {
            .customer {
                flex-direction: column;
                text-align: center;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</nav>

<div class="container">

    <div class="customer">

        <div class="avatar">PN</div>

        <div>
            <h1>Parimala Nakka</h1>
            <p>Premium Customer</p>
            <p>Member since 2025</p>
        </div>

    </div>

    <div class="stats">

        <div class="stat">
            <p>Orders</p>
            <div class="number">48</div>
        </div>

        <div class="stat">
            <p>Projects</p>
            <div class="number">12</div>
        </div>

        <div class="stat">
            <p>Spent</p>
            <div class="number">$4,820</div>
        </div>

        <div class="stat">
            <p>Points</p>
            <div class="number">8,420</div>
        </div>

    </div>

</div>

</body>
</html>
