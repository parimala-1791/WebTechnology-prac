<!DOCTYPE html>
<html>
<head>
    <title>CSS 113 - Chip Component</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        .container {
            padding: 60px;
            text-align: center;
        }

        .chip {
            display: inline-block;
            padding: 10px 18px;
            margin: 8px;
            border-radius: 30px;
            background: #dbeafe;
            color: #1d4ed8;
            font-weight: bold;
        }

        .chip span {
            margin-left: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="container">

    <h1>Skills</h1>

    <div class="chip">HTML <span>×</span></div>
    <div class="chip">CSS <span>×</span></div>
    <div class="chip">JavaScript <span>×</span></div>
    <div class="chip">Python <span>×</span></div>
    <div class="chip">Data Science <span>×</span></div>

</div>

</body>
</html>
