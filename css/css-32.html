<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 32 - Transitions</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
        }

        .button {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;

            transition:
                background-color 0.5s,
                transform 0.5s;
        }

        .button:hover {
            background: #172554;
            transform: scale(1.1);
        }

        .box {
            width: 150px;
            height: 100px;
            background: #16a34a;
            margin: 40px auto;

            transition:
                width 1s,
                height 1s;
        }

        .box:hover {
            width: 250px;
            height: 150px;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS Transitions</h1>
    <p>Creating smooth changes between states</p>
</header>

<div class="content">

    <div class="button">
        Hover Over Me
    </div>

    <div class="box"></div>

    <p>
        Hover over the elements to see the transition effect.
    </p>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
