<!DOCTYPE html>
<html>
<head>
    <title>CSS 97 - Profile Settings</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .profile {
            width: 550px;
            margin: 50px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 12px #cbd5e1;
        }

        h1 {
            color: #172554;
        }

        label {
            display: block;
            margin-top: 18px;
            color: #475569;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #172554;
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="profile">

        <h1>Profile Settings</h1>

        <form>

            <label>Full Name</label>
            <input type="text" value="Parimala Nakka">

            <label>Email</label>
            <input type="email" value="parimala@example.com">

            <label>Course</label>
            <input type="text" value="Computing and Data Science">

            <label>Bio</label>
            <textarea>Student interested in programming and data science.</textarea>

            <button type="submit">Save Changes</button>

        </form>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
