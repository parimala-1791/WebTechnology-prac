<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 16 - Visibility and Opacity</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        .visible {
            background: #dbeafe;
            padding: 20px;
            margin: 15px;
        }

        .hidden {
            background: #fecaca;
            padding: 20px;
            margin: 15px;
            visibility: hidden;
        }

        .opacity-50 {
            background: #2563eb;
            color: white;
            padding: 20px;
            margin: 15px;
            opacity: 0.5;
        }

        .opacity-20 {
            background: #172554;
            color: white;
            padding: 20px;
            margin: 15px;
            opacity: 0.2;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>Visibility and Opacity</h1>
</header>

<div class="content">

    <div class="visible">
        This element is visible.
    </div>

    <div class="hidden">
        This element is hidden using visibility: hidden.
    </div>

    <div class="opacity-50">
        Opacity: 0.5
    </div>

    <div class="opacity-20">
        Opacity: 0.2
    </div>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
