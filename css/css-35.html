<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS 35 - Animations</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 50px 30px;
            border-radius: 12px;
            text-align: center;
        }

        .animated-box {
            width: 120px;
            height: 120px;
            background: #2563eb;
            margin: 30px auto;
            border-radius: 15px;

            animation: moveBox 3s infinite alternate;
        }

        @keyframes moveBox {

            0% {
                transform: translateX(-100px);
            }

            100% {
                transform: translateX(100px);
            }
        }

        .spinner {
            width: 70px;
            height: 70px;
            border: 8px solid #dbeafe;
            border-top: 8px solid #172554;
            border-radius: 50%;
            margin: 50px auto;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .pulse {
            width: 100px;
            height: 100px;
            background: #16a34a;
            border-radius: 50%;
            margin: 30px auto;

            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }

            100% {
                transform: scale(1);
            }
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS Animations</h1>
    <p>Animations, keyframes and loading spinner</p>
</header>

<div class="content">

    <h2>Moving Animation</h2>

    <div class="animated-box"></div>

    <h2>Loading Spinner</h2>

    <div class="spinner"></div>

    <h2>Pulse Animation</h2>

    <div class="pulse"></div>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
