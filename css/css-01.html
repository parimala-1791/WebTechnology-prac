<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 01 - Inline CSS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>Inline CSS</h1>
    <p>Styling HTML elements using the style attribute</p>
</header>

<div class="content">

    <h2 style="color: blue;">Inline CSS Heading</h2>

    <p style="font-size: 20px; color: green;">
        This paragraph is styled using inline CSS.
    </p>

    <div style="
        background-color: #e0e7ff;
        padding: 20px;
        border: 2px solid #2563eb;
        text-align: center;
    ">
        This box is also styled using inline CSS.
    </div>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
