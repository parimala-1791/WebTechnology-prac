<!DOCTYPE html>
<html>
<head>
    <title>CSS 161 - AI Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .navigation {
            padding: 20px;
            background: white;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
        }

        .dashboard {
            padding: 40px 8%;
        }

        .ai-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            max-width: 800px;
            margin: auto;
            box-shadow: 0 8px 25px rgba(0,0,0,.07);
        }

        .ai-card h1 {
            color: #2563eb;
        }

        .feature {
            padding: 18px;
            margin: 15px 0;
            background: #eff6ff;
            border-radius: 10px;
        }

        .feature h3 {
            margin-bottom: 5px;
        }

        .feature p {
            color: #667085;
        }
    </style>
</head>
<body>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

<div class="dashboard">

    <div class="ai-card">

        <h1>AI Assistant Dashboard</h1>
        <p>Manage your intelligent tools.</p>

        <div class="feature">
            <h3>🤖 AI Chat</h3>
            <p>Ask questions and get intelligent responses.</p>
        </div>

        <div class="feature">
            <h3>📊 Data Analysis</h3>
            <p>Analyze datasets using AI-powered tools.</p>
        </div>

        <div class="feature">
            <h3>✍️ Content Generation</h3>
            <p>Create useful content quickly.</p>
        </div>

    </div>

</div>

</body>
</html>
