<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS 34 - 3D Transforms</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 50px 30px;
            border-radius: 12px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 60px;
            perspective: 800px;
        }

        .box {
            width: 150px;
            height: 120px;
            background: #2563eb;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            transition: transform 0.8s;
        }

        .rotate-x:hover {
            transform: rotateX(50deg);
        }

        .rotate-y:hover {
            transform: rotateY(50deg);
        }

        .rotate-z:hover {
            transform: rotateZ(30deg);
        }

        .scale-3d:hover {
            transform: scale3d(1.3, 1.3, 1.3);
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS 3D Transforms</h1>
    <p>Creating three-dimensional transformations</p>
</header>

<div class="content">

    <div class="container">

        <div class="box rotate-x">
            Rotate X
        </div>

        <div class="box rotate-y">
            Rotate Y
        </div>

        <div class="box rotate-z">
            Rotate Z
        </div>

        <div class="box scale-3d">
            Scale 3D
        </div>

    </div>

    <p style="text-align:center; margin-top:50px;">
        Hover over the boxes to see the 3D effects.
    </p>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
</div>

</body>
</html>
