<!DOCTYPE html>
<html>
<head>
    <title>CSS 43 - Alert Messages</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
        }

        h1 {
            text-align: center;
            color: #172554;
        }

        .alert {
            padding: 18px;
            margin: 15px 0;
            border-radius: 8px;
            font-size: 16px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            border-left: 5px solid #16a34a;
        }

        .info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 5px solid #2563eb;
        }

        .warning {
            background: #fef3c7;
            color: #92400e;
            border-left: 5px solid #f59e0b;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 5px solid #dc2626;
        }

        .navigation {
            text-align: center;
            margin: 40px;
        }

        .navigation a {
            margin: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Alert Messages</h1>

        <div class="alert success">
            ✓ Success! Your account was created successfully.
        </div>

        <div class="alert info">
            ℹ Information: Your profile is being updated.
        </div>

        <div class="alert warning">
            ⚠ Warning! Your storage space is almost full.
        </div>

        <div class="alert error">
            ✕ Error! Something went wrong.
        </div>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
