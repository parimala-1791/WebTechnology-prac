<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 13 - Responsive Webpage</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            display: flex;
            gap: 20px;
            width: 90%;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            flex: 1;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 12px #ccc;
        }

        .card h2 {
            color: #2563eb;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }

        @media (max-width: 700px) {

            .container {
                flex-direction: column;
            }

            .card {
                width: auto;
            }

            header h1 {
                font-size: 25px;
            }
        }

    </style>
</head>

<body>

<header>
    <h1>Responsive Webpage</h1>
    <p>Resize the browser window to see the effect</p>
</header>

<div class="container">

    <div class="card">
        <h2>HTML</h2>
        <p>Creates the structure of a webpage.</p>
    </div>

    <div class="card">
        <h2>CSS</h2>
        <p>Styles and designs the webpage.</p>
    </div>

    <div class="card">
        <h2>JavaScript</h2>
        <p>Adds functionality and interaction.</p>
    </div>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to HTML Programs</a>
</div>

</body>
</html>
