<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 12 - CSS Properties</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
        }

        header {
            background-color: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border: 2px solid #2563eb;
            border-radius: 12px;
        }

        h2 {
            color: #2563eb;
            font-family: Georgia, serif;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .box {
            margin: 20px;
            padding: 20px;
            border: 3px solid #172554;
            background-color: #eef2ff;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }

    </style>
</head>

<body>

<header>
    <h1>CSS Properties</h1>
    <p>Selectors, Colors, Fonts, Margins, Padding and Borders</p>
</header>

<div class="content">

    <h2>CSS Selectors</h2>

    <p>
        CSS selectors are used to select HTML elements
        for styling.
    </p>

    <div class="box">
        This box demonstrates margin, padding,
        border and background color.
    </div>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to HTML Programs</a>
</div>

</body>
</html>
