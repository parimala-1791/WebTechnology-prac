<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 07 - Iframe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            text-align: center;
        }

        header {
            background: #172554;
            color: white;
            padding: 30px;
        }

        .content {
            width: 80%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: 2px solid #172554;
            border-radius: 10px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>Frames and Iframes</h1>
</header>

<div class="content">

    <h2>Embedded Webpage</h2>

    <iframe
        src="https://www.example.com"
        title="Example Website">
    </iframe>

</div>

<div style="margin:30px;">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to HTML Programs</a>
</div>

</body>
</html>
