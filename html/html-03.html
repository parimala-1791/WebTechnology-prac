<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 03 - Tables</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            border: 2px solid #172554;
            padding: 15px;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            text-decoration: none;
            background: #172554;
            color: white;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 6px;
            display: inline-block;
        }
    </style>
</head>

<body>

<header>
    <h1>HTML Tables</h1>
    <p>Rows, Columns and Merged Cells</p>
</header>

<div class="content">

    <table>
        <tr>
            <th colspan="3">Student Details</th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>Parimala</td>
            <td>Data Science</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>Computer Science</td>
            <td>90</td>
        </tr>

        <tr>
            <td rowspan="2">Total</td>
            <td>Average</td>
            <td>87.5</td>
        </tr>

        <tr>
            <td colspan="2">Result: Passed</td>
        </tr>
    </table>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to HTML Programs</a>
</div>

</body>
</html>
