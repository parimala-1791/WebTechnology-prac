<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 08 - Semantic HTML</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
        }

        header, footer {
            background: #172554;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background: #2563eb;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }

        section, article {
            background: white;
            margin: 25px auto;
            padding: 25px;
            width: 80%;
            border-radius: 10px;
            box-shadow: 0 4px 10px #ccc;
        }

        h2 {
            color: #2563eb;
        }
    </style>
</head>

<body>

<header>
    <h1>My Website</h1>
    <p>Semantic HTML Example</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<section>

    <h2>About Me</h2>

    <article>
        <h3>Student Profile</h3>
        <p>
            I am a Computing and Data Science student
            learning web development.
        </p>
    </article>

</section>

<footer>
    <p>© 2026 My Website</p>
</footer>

<div style="text-align:center; margin:30px;">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to HTML Programs</a>
</div>

</body>
</html>
