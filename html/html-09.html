<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 09 - Input Types</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        form {
            width: 80%;
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #aaa;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>HTML5 Input Types</h1>
</header>

<form>

    <label>Email</label>
    <input type="email" placeholder="Enter email">

    <label>Date</label>
    <input type="date">

    <label>Number</label>
    <input type="number" min="1" max="100">

    <label>Password</label>
    <input type="password" placeholder="Enter password">

    <button type="submit">Submit</button>

</form>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to HTML Programs</a>
</div>

</body>
</html>
