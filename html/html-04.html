<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 04 - Images and Links</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            text-align: center;
        }

        header {
            background: #172554;
            color: white;
            padding: 30px;
        }

        .content {
            width: 80%;
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
        }

        a {
            display: inline-block;
            margin: 15px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .navigation a {
            background: #172554;
        }
    </style>
</head>

<body>

<header>
    <h1>Images and Hyperlinks</h1>
</header>

<div class="content">

    <h2>Sample Image</h2>

    <img src="https://picsum.photos/300/200" alt="Sample Image">

    <h2>Useful Links</h2>

    <a href="https://www.google.com" target="_blank">Google</a>

    <a href="https://www.github.com" target="_blank">GitHub</a>

</div>

<div class="navigation">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to HTML Programs</a>
</div>

</body>
</html>
