<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 11 - CSS Styling</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            text-align: center;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            padding: 30px;
        }

        .box {
            background: white;
            width: 70%;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        h2 {
            color: #2563eb;
        }

        .external-style {
            color: green;
            font-size: 20px;
        }

        a {
            background: #172554;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }
    </style>

    <!-- External CSS can also be linked using:
    <link rel="stylesheet" href="../assets/style.css">
    -->

</head>

<body>

<header>
    <h1>Internal and External CSS</h1>
</header>

<div class="box">

    <h2>Internal CSS</h2>

    <p>
        The styles in the head section of this page
        are an example of internal CSS.
    </p>

    <h2>External CSS</h2>

    <p class="external-style">
        External CSS is stored in a separate .css file
        and linked using the link tag.
    </p>

</div>

<div style="margin:30px;">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to HTML Programs</a>
</div>

</body>
</html>
